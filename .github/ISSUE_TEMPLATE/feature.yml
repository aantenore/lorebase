name: Feature request
description: Propose a capability or an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way? Real scenarios shape the roadmap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. Use the vocabulary in docs/glossary.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or existing tools that cover part of this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core (engine, merge, schema)
        - store (Postgres schema, migrations)
        - keeper (API)
        - inference
        - client or CLI
        - web app
        - MCP server
        - deploy (Docker, compose)
        - docs
        - not sure
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this
