# Dependency updates. Labels used here are documented in CONTRIBUTING.md and must exist in the
# repository for Dependabot to apply them.
version: 2

updates:
  # Python workspace: pyproject.toml and uv.lock at the repository root.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, area/backend]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Web app: pnpm lockfile in apps/web.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, area/web]
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Workflow actions, pinned to commit SHAs with a version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    labels: [dependencies, area/ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Base images of the container build.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    labels: [dependencies, area/deploy]
    commit-message:
      prefix: "chore(deps)"

  # Images referenced by the compose file.
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    labels: [dependencies, area/deploy]
    commit-message:
      prefix: "chore(deps)"
