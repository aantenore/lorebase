name: Docker

on:
  pull_request:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Builds the backend image on pull requests to prove it still builds. Nothing is pushed and no
# registry credentials are used; publishing belongs to the release workflow.
jobs:
  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: false
          load: true
          tags: lorebase:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: The image runs as a non-root user
        run: |
          uid="$(docker run --rm lorebase:ci id -u)"
          test "$uid" != "0"
      - name: The Keeper package imports
        run: docker run --rm lorebase:ci python -c "import lorebase_keeper, lorebase_store"

  compose-config:
    name: Validate compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose config, every profile enabled
        run: >-
          docker compose --env-file .env.example
          -f deploy/compose/docker-compose.yaml
          --profile local-models --profile litellm --profile observability
          config --quiet
