name: Docker

on:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Builds the backend images on demand to prove they still build and run, on a runner of each
# architecture the release publishes (release.yaml, image-platforms). Nothing is pushed and no
# registry credentials are used; publishing belongs to the release workflow.
jobs:
  backend-image:
    name: Build backend image (${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - os: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          platforms: ${{ matrix.platform.os }}
          push: false
          load: true
          tags: lorebase:ci
          cache-from: type=gha,scope=backend-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=backend-${{ matrix.platform.arch }},mode=max
      - name: The image runs as a non-root user
        run: |
          uid="$(docker run --rm lorebase:ci id -u)"
          test "$uid" != "0"
      - name: The Keeper package imports
        run: docker run --rm lorebase:ci python -c "import lorebase_keeper, lorebase_store"
      - name: Build the embedding image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          target: backend-ml
          platforms: ${{ matrix.platform.os }}
          push: false
          load: true
          tags: lorebase-ml:ci
          cache-from: type=gha,scope=backend-ml-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=backend-ml-${{ matrix.platform.arch }},mode=max
      - name: The embedding image embeds offline with a read-only file system
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp lorebase-ml:ci python -c
          "from lorebase_inference.settings import EmbeddingSettings; from fastembed import TextEmbedding;
          s = EmbeddingSettings(); import os;
          m = TextEmbedding(model_name=s.model, cache_dir=os.environ['FASTEMBED_CACHE_PATH']);
          assert len(next(iter(m.embed(['probe'])))) == s.dims"

  compose-config:
    name: Validate compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: docker compose config, every profile enabled
        # .env.example leaves the required secrets empty; any value proves the file renders.
        env:
          LOREBASE_APP_PASSWORD: compose-config-check
          LOREBASE_WEBHOOK_KEY: compose-config-check
        run: >-
          docker compose --env-file .env.example
          -f deploy/compose/docker-compose.yaml
          --profile local-models --profile litellm --profile observability
          config --quiet
