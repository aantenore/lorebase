name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No secrets are used anywhere in this workflow, and no model provider key exists in CI: tests
# run against the deterministic fake provider.
env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and import contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --extra documents
      - name: ruff and import-linter
        run: make lint

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --extra documents
      - name: mypy strict for core, store, keeper, herald, client and cli; default settings for the rest
        run: make type

  unit:
    name: Unit tests (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --extra documents
      - name: pytest inside an empty network namespace
        # The test suite also refuses outbound sockets in-process (conftest.py); this second
        # layer removes every network interface for the whole run, and the step first proves
        # that the namespace really has no connectivity.
        env:
          UV_NO_SYNC: "1"
        run: |
          isolated() {
            sudo -E unshare --net -- \
              setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
              env "PATH=$PATH" "$@"
          }
          if isolated uv run python -c \
            "import socket; socket.create_connection(('1.1.1.1', 53), timeout=3)" 2>/dev/null; then
            echo "the network namespace is not isolated" >&2
            exit 1
          fi
          isolated make test-unit

  integration:
    name: Integration tests (Postgres 16 with pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lorebase
          POSTGRES_PASSWORD: lorebase-ci
          POSTGRES_DB: lorebase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorebase -d lorebase_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      LOREBASE_TEST_DATABASE_URL: postgresql+asyncpg://lorebase:lorebase-ci@localhost:5432/lorebase_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --extra documents
      - name: pytest -m integration (tests/integration and packages)
        run: make test-int

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # docs/openapi.json: the generated API types are checked against it.
          sparse-checkout: |
            apps/web
            docs
      - name: Detect the web app
        id: detect
        working-directory: .
        run: echo "present=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: No web app yet
        if: steps.detect.outputs.present != 'true'
        working-directory: .
        run: echo "apps/web does not exist yet; nothing to check."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run test
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run build

  helm:
    name: Helm chart (lint, template, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/lorebase
      # kubeconform image and the Kubernetes version the manifests are validated against.
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
      KUBERNETES_VERSION: "1.30.0"
      # Schemas of the custom resources the chart can render (ServiceMonitor, CloudNativePG Cluster).
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # deploy/observability: the chart's `observability` symlink points into it.
          sparse-checkout: |
            deploy/helm
            deploy/observability
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.1
      - name: Fetch the chart dependencies (pinned by Chart.lock)
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm dependency build "$CHART"
      - name: helm lint, every profile
        run: |
          helm lint --strict "$CHART" -f "$CHART/ci/minimal-values.yaml"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/scale-out-values.yaml"
          helm lint --strict "$CHART" -f "$CHART/ci/local-models-values.yaml"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/sessions-values.yaml"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/guide-values.yaml"
      - name: helm template, every profile
        run: |
          mkdir -p build/helm
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/minimal-values.yaml" > build/helm/minimal.yaml
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/production-values.yaml" > build/helm/production.yaml
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/scale-out-values.yaml" > build/helm/scale-out.yaml
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/local-models-values.yaml" > build/helm/local-models.yaml
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/sessions-values.yaml" > build/helm/sessions.yaml
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/guide-values.yaml" > build/helm/guide.yaml
          helm template ci "$CHART" -n lorebase -f "$CHART/ci/production-values.yaml" -f "$CHART/ci/scale-out-values.yaml" -f "$CHART/ci/local-models-values.yaml" > build/helm/all.yaml
      - name: values.schema.json refuses a wrong type, value or key
        run: |
          test -f "$CHART/values.schema.json"
          for bad in keeper.replicaCount=two logLevel=VERBOSE keeper.replicaCont=2 migrate.hookEvents=pre-everything; do
            if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --set "$bad" > /dev/null 2> build/schema.err; then
              echo "the chart rendered with $bad" >&2
              exit 1
            fi
            grep -q "schema" build/schema.err || { cat build/schema.err >&2; exit 1; }
          done
      - name: The chart refuses an unsafe or incomplete configuration
        run: |
          if helm template ci "$CHART" > /dev/null 2>&1; then
            echo "the chart rendered without a database or an API key pepper" >&2
            exit 1
          fi
          if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --set config.keeper.auth.sessions.enabled=true > /dev/null 2>&1; then
            echo "the chart rendered web sign-in without an OIDC mode, client or secrets" >&2
            exit 1
          fi
          # Keeper and Scribe never connect as the maintenance role (docs/kubernetes.md#database-roles).
          owner=postgresql+asyncpg://lorebase:x@postgres.example.internal:5432/lorebase
          if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --set secrets.values.dbMaintenanceDsn=null > /dev/null 2>&1; then
            echo "the chart rendered without a maintenance role" >&2
            exit 1
          fi
          if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --set secrets.values.dbDsn="$owner" --set secrets.values.dbMaintenanceDsn="$owner" > /dev/null 2>&1; then
            echo "the chart rendered one role for the services and the migrations" >&2
            exit 1
          fi
          if helm template ci "$CHART" -f "$CHART/ci/local-models-values.yaml" --set database.appRole.name=lorebase > /dev/null 2>&1; then
            echo "the chart rendered the in-cluster database owner as the application role" >&2
            exit 1
          fi
          helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --set secrets.values.dbDsn="$owner" \
            --set secrets.values.dbMaintenanceDsn=null --set database.allowSharedRole=true > /dev/null
      - name: kubeconform, strict, against the Kubernetes schemas
        run: |
          docker run --rm -v "$PWD/build/helm:/manifests:ro" "$KUBECONFORM_IMAGE" \
            -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$CRD_SCHEMAS" \
            /manifests


  web-e2e:
    name: Web end-to-end (Keeper from the repository, Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Postgres is a service container and Keeper is started from the checkout: no Docker inside
    # the job, and no image build. The suite brings up its own web server (vite preview).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lorebase
          POSTGRES_PASSWORD: lorebase-ci
          POSTGRES_DB: lorebase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorebase -d lorebase_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      LOREBASE__DATABASE__DSN: secret://env/LOREBASE_DB_DSN
      LOREBASE_DB_DSN: postgresql+asyncpg://lorebase:lorebase-ci@localhost:5432/lorebase_e2e
      LOREBASE__KEEPER__HOST: 127.0.0.1
      LOREBASE__KEEPER__PORT: "8080"
      # Authentication is off, so the author of a Proposal is also its reviewer.
      LOREBASE__KEEPER__PROPOSALS__ALLOW_SELF_APPROVAL: "true"
      LOREBASE__LOGGING__LEVEL: WARNING
      LOREBASE_E2E_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - name: Migrate the database
        working-directory: packages/store
        run: uv run alembic upgrade head
      - name: Start Keeper
        run: |
          nohup uv run python -m lorebase_keeper > "$RUNNER_TEMP/keeper.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$LOREBASE_E2E_URL/readyz" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/keeper.log"
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install the web app and Chromium
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Playwright flows against Keeper
        working-directory: apps/web
        run: pnpm run e2e
      - name: Keeper log
        if: failure()
        run: cat "$RUNNER_TEMP/keeper.log"
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-report
          path: |
            apps/web/node_modules/.cache/e2e/report
            apps/web/node_modules/.cache/e2e/results
          if-no-files-found: ignore
          retention-days: 7

  # Single required check for branch protection: fails when any job above failed or was cancelled.
  ci:
    name: CI
    if: always()
    needs: [lint, types, unit, integration, web, web-e2e, helm]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
