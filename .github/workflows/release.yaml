name: Release

# Runs when a version tag is pushed (v0.1.0, v0.2.0-rc.1). The checklist, the secrets it uses and
# how to verify what it publishes are in docs/release.md. Nothing here runs on a pull request.
#
#   verify   the tag, every version in the repository and the changelog section agree
#   sbom     CycloneDX documents of the Python workspace and the web app (sbom.yaml)
#   images   backend and web images pushed to GHCR, signed with cosign (keyless) and given the
#            SBOM as an attestation
#   helm     the chart packaged with the release version
#   python   sdists and wheels of the workspace packages
#   release  GitHub release with notes, SBOMs, chart, packages and signed checksums
#   pypi     the packages to PyPI, only when the PYPI_API_TOKEN secret exists
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Every version equals the tag
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project --with pyyaml python scripts/release_tool.py check --tag "$TAG"
      - name: The changelog has a section for it
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          uv run --no-project --with pyyaml python scripts/release_tool.py notes "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  sbom:
    name: SBOMs
    needs: verify
    uses: ./.github/workflows/sbom.yaml

  images:
    name: Image ${{ matrix.name }}
    needs: [verify, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/aantenore/lorebase
            dockerfile: deploy/docker/backend.Dockerfile
            sbom_artifact: sbom-python
            sbom_file: sbom-python.cdx.json
            build_args: ""
          - name: web
            image: ghcr.io/aantenore/lorebase-web
            dockerfile: deploy/docker/web.Dockerfile
            sbom_artifact: sbom-web
            sbom_file: sbom-web.cdx.json
            # The app reads its configuration at build time: the published image runs on the
            # mock API. See docs/release.md, "Known gaps".
            build_args: |
              VITE_API_MODE=mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.sbom_artifact }}
          path: sbom
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease != 'true' }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            ${{ matrix.build_args }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless) and attach the SBOM as an attestation
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: sbom/${{ matrix.sbom_file }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "$SBOM" "${IMAGE}@${DIGEST}"
      - name: Write what was published to the job summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "digest \`${DIGEST}\`"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm chart
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            deploy/helm
            deploy/observability
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint, then package with the release version
        env:
          CHART: deploy/helm/lorebase
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm dependency build "$CHART"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml"
          mkdir -p chart
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" --destination chart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-helm-chart
          path: chart/*.tgz
          if-no-files-found: error

  python:
    name: Python packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build an sdist and a wheel of every workspace package
        run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, images, helm, python, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # Only the files meant for the release: the build action also uploads build records.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums, signed
        run: |
          mv assets/release-notes.md release-notes.md
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/SHA256SUMS
          cd assets
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Create the release, or add the files to it when it exists
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --verify-tag --title "Lorebase $VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Is publishing configured?
        id: token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is not set, so nothing was published to PyPI. The packages are on the GitHub release. See docs/release.md."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.token.outputs.present == 'true'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
