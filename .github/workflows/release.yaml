name: Release

# Runs when a version tag is pushed (v0.1.0, v0.2.0-rc.1), or by hand on a tag that already exists
# (workflow_dispatch with the tag as input). The checklist, the secrets it uses and how to verify
# what it publishes are in docs/release.md. Nothing here runs on a pull request.
#
#   verify   the tag, every version in the repository and the changelog section agree
#   ci       the whole CI workflow (ci.yaml) on the tagged commit; nothing is pushed or published
#            unless it passes
#   sbom     CycloneDX documents of the Python workspace and the web app (sbom.yaml)
#   image-platforms
#            backend, backend-ml and web images built natively for linux/amd64 and linux/arm64
#            and pushed to GHCR by digest only
#   images   the platform images of each one joined into a multi-arch index, tagged, signed with
#            cosign (keyless) and given the SBOM as an attestation
#   helm     the chart packaged with the release version
#   python   sdists and wheels of the workspace packages
#   release  GitHub release with notes, SBOMs, chart, packages and signed checksums
#   pypi     each package to PyPI from its own environment, through trusted publishing, only when the PYPI_TRUSTED_PUBLISHING variable is true
#   docs     the documentation site (docs.yaml) built from the tag and published to GitHub Pages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.2.3
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  # The tag being released: the pushed one, or the input of a manual run.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: The tag is a version tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::'$RELEASE_TAG' is not a version tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: The tag exists
        id: revision
        run: |
          sha=$(git rev-parse --verify --quiet "$RELEASE_REF^{commit}") || { echo "::error::tag $RELEASE_TAG not found"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Every version equals the tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: uv run --no-project --with pyyaml python scripts/release_tool.py check --tag "$TAG"
      - name: The changelog has a section for it
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          uv run --no-project --with pyyaml python scripts/release_tool.py notes "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The CI workflow of the tagged commit. Images, the GitHub release and PyPI wait for it, so a
  # tag whose checks fail publishes nothing; run the release again once a fix is tagged.
  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  sbom:
    name: SBOMs
    needs: verify
    uses: ./.github/workflows/sbom.yaml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  # Every image is built on a runner of its own architecture (no emulation: the backend-ml target
  # runs Python to bake its model) and pushed by digest only, without a tag. The `images` job
  # joins the platform images into one index, tags it and signs it.
  image-platforms:
    name: Image ${{ matrix.image.name }} (${{ matrix.platform.os }})
    needs: [verify, ci]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - os: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: backend
            repository: ghcr.io/aantenore/lorebase
            dockerfile: deploy/docker/backend.Dockerfile
            target: ""
            build_args: ""
          # Scribe and Guide: the backend image plus fastembed and a baked embedding model.
          - name: backend-ml
            repository: ghcr.io/aantenore/lorebase-ml
            dockerfile: deploy/docker/backend.Dockerfile
            target: backend-ml
            build_args: ""
          - name: web
            repository: ghcr.io/aantenore/lorebase-web
            dockerfile: deploy/docker/web.Dockerfile
            target: ""
            # The app reads its configuration at build time: the published image runs on the
            # mock API. See docs/release.md, "Known gaps".
            build_args: |
              VITE_API_MODE=mock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image.repository }}
          tags: type=raw,value=${{ needs.verify.outputs.version }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.os }}
          outputs: type=image,name=${{ matrix.image.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ needs.verify.outputs.revision }}
            ${{ matrix.image.build_args }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max
      - name: Keep the digest for the index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images:
    name: Image ${{ matrix.name }}
    needs: [verify, sbom, image-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/aantenore/lorebase
            sbom_artifact: sbom-python
            sbom_file: sbom-python.cdx.json
          - name: backend-ml
            image: ghcr.io/aantenore/lorebase-ml
            sbom_artifact: sbom-python
            sbom_file: sbom-python.cdx.json
          - name: web
            image: ghcr.io/aantenore/lorebase-web
            sbom_artifact: sbom-web
            sbom_file: sbom-web.cdx.json
    env:
      # Platforms the index must hold; the same as the platform matrix of image-platforms.
      PLATFORMS: linux/amd64 linux/arm64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.sbom_artifact }}
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.name }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ needs.verify.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease != 'true' }}
      - name: Join the platform images into one index and push its tags
        id: index
        working-directory: digests
        env:
          IMAGE: ${{ matrix.image }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$META")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          first="$(jq -r '.tags[0]' <<< "$META")"
          docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' > "$RUNNER_TEMP/index.json"
          echo "digest=$(jq -r '.digest' "$RUNNER_TEMP/index.json")" >> "$GITHUB_OUTPUT"
      - name: The index holds every platform
        run: |
          found="$(jq -r '.manifests[].platform | select(. != null) | .os + "/" + .architecture' "$RUNNER_TEMP/index.json")"
          for platform in $PLATFORMS; do
            grep -qx "$platform" <<< "$found" || { echo "::error::$platform is missing from the index"; exit 1; }
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature and the SBOM attestation are on the index digest, which every tag and
      # every platform resolves through.
      - name: Sign the index (keyless) and attach the SBOM as an attestation
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          SBOM: sbom/${{ matrix.sbom_file }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "$SBOM" "${IMAGE}@${DIGEST}"
      - name: Write what was published to the job summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "index digest \`${DIGEST}\` ($PLATFORMS)"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm chart
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          sparse-checkout: |
            deploy/helm
            deploy/observability
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - name: Lint, then package with the release version
        env:
          CHART: deploy/helm/lorebase
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm dependency build "$CHART"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml"
          mkdir -p chart
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" --destination chart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-helm-chart
          path: chart/*.tgz
          if-no-files-found: error

  python:
    name: Python packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build an sdist and a wheel of every workspace package
        run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-python-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, ci, images, helm, python, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # Only the files meant for the release: the build action also uploads build records.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums, signed
        run: |
          mv assets/release-notes.md release-notes.md
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/SHA256SUMS
          cd assets
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Create the release, or add the files to it when it exists
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --verify-tag --title "Lorebase $VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi

  pypi:
    name: PyPI ${{ matrix.package }}
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every package has its own GitHub environment (pypi-<package>) because PyPI accepts one
    # pending trusted publisher per identical (owner, repository, workflow, environment) and at
    # most three pending at once: the projects are created in rounds. A package whose publisher
    # is not configured yet fails its own job without failing the release.
    continue-on-error: true
    environment: pypi-${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [core, platform, inference, store, keeper, client, cli, herald, scribe, guide]
    steps:
      - name: Is publishing configured?
        id: token
        env:
          ENABLED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The PYPI_TRUSTED_PUBLISHING variable is not true, so nothing was published to PyPI. The packages are on the GitHub release. See docs/release.md."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-python-dist
          path: dist
      - name: Keep the files of this package
        if: steps.token.outputs.present == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir dist-package
          cp dist/lorebase_"$PACKAGE"-"$VERSION"* dist-package/
          ls dist-package
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.token.outputs.present == 'true'
        with:
          packages-dir: dist-package
          skip-existing: true

  # The documentation site of the release, built from the tag once the release exists.
  docs:
    name: Documentation site
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yaml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
