name: SBOM

# CycloneDX software bills of materials for the Python workspace and the web app, built from the
# lockfiles. Produced on release tags and on demand; the files are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  CYCLONEDX_PY: cyclonedx-bom==7.5.0

jobs:
  python:
    name: Python workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Export the locked runtime dependencies
        run: uv export --all-packages --no-dev --no-emit-workspace -o requirements.sbom.txt
      - name: Generate the CycloneDX document
        run: >-
          uvx --from "$CYCLONEDX_PY" cyclonedx-py requirements requirements.sbom.txt
          --pyproject pyproject.toml --mc-type application
          --of JSON -o sbom-python.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          if-no-files-found: error

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/web
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Generate the CycloneDX document from the lockfile
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --prod --out sbom-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: apps/web/sbom-web.cdx.json
          if-no-files-found: error
