# Lorebase example configuration.
#
# Point LOREBASE_CONFIG at a copy of this file. Precedence, lowest to highest:
#   code defaults < this file < environment variables LOREBASE__SECTION__KEY
# (nested keys use more double underscores: LOREBASE__INFERENCE__LLM__BASE_URL).
#
# The values below are the defaults compiled into the code; every key is optional.
# Secret settings accept a literal, `secret://env/NAME` (environment variable) or
# `secret://file//absolute/path` (file content).

logging:
  level: INFO                    # CRITICAL | ERROR | WARNING | INFO | DEBUG
  format: json                   # json | text
  redact_keys:                   # field names whose values are masked in every log record
    - password
    - secret
    - token
    - api_key
    - authorization
    - credential
  redact_min_length: 4           # shorter secret values are not masked inside free text

telemetry:
  otlp_endpoint: null            # e.g. http://otel-collector:4317; unset disables telemetry
  service_name: lorebase
  service_namespace: lorebase
  sample_ratio: 0.1              # fraction of root traces sampled, 0 to 1
  metric_export_interval_s: 60

# Keeper, the REST API service. Environment: LOREBASE__KEEPER__PORT, LOREBASE__KEEPER__HOST, ...
keeper:
  host: 127.0.0.1                # bind address; containers set 0.0.0.0
  port: 8080
  api_prefix: /api/v1            # version prefix of every API route; OpenAPI at <prefix>/openapi.json
  request_id_header: X-Request-ID          # accepted from clients when well formed, echoed back
  problem_type_base: "urn:lorebase:problem:"   # error `type` URI = this prefix + error code
  cors:
    allow_origins: []            # browser origins allowed to call the API; empty disables CORS
    allow_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allow_headers: [Authorization, Content-Type, Idempotency-Key]
    allow_credentials: false     # cannot be combined with the "*" origin
    max_age_s: 600
  limits:
    max_request_body_bytes: 1048576   # larger bodies are rejected with 413
  pagination:
    default_limit: 50
    max_limit: 500
  reads:
    reachability_max_depth: 1000 # parent hops followed to prove that a Revision or tag named by
                                 # a caller with branch-scoped grants is reachable from a branch
                                 # the caller may read; further back: 403
    cache:                       # in-process cache of GET read responses, keyed by Revision:
      enabled: true              # commits move branches to new Revisions, so no invalidation
      max_entries: 1024
      max_bytes: 33554432        # 32 MiB of response bodies
      ttl_s: 300
      max_body_bytes: 1048576    # larger responses are not cached
      time_travel_max_entries: 128   # entries for reads at another Revision; 0 never caches them
    prefer_replica: false        # true: read endpoints use the replicas of database.read_dsn
                                 # when one is fresh enough (see docs/deployment.md)
  readiness:
    timeout_s: 2                 # time budget of each /readyz check
    database_section: database   # settings section with the connection string; if absent the
    database_dsn_key: dsn        # database check reports not_configured
  auth:
    mode: none                   # none | api_key | oidc | api_key+oidc. `none` accepts every
                                 # request as an administrator: local development only. The
                                 # other modes need the `database` section below
    installation_admins: []      # principal ids, identity provider subjects or group ids allowed
                                 # to administer the installation (list principals). They get
                                 # no access to Domain data
    api_keys:                    # agents and automation: Authorization: Bearer lbk_... or X-Api-Key
      token_prefix: lbk          # keys look like <token_prefix>_<prefix>_<secret>
      header: X-Api-Key          # header accepted besides Authorization: Bearer
      pepper: null               # REQUIRED with api_key modes: >= 32 characters, e.g.
                                 # secret://env/LOREBASE_API_KEY_PEPPER. Changing it invalidates
                                 # every issued key
      prefix_length: 10          # characters of the public lookup prefix
      secret_bytes: 32           # random bytes of the secret part
      default_ttl_days: 365      # lifetime of new keys; null: no expiry
      max_ttl_days: null         # longest lifetime an admin may request; null: no limit
      last_used_interval_s: 60   # a key's last-used time is written at most this often
    oidc:                        # bearer tokens of any OpenID Connect provider
      issuer: null               # REQUIRED with oidc modes: expected `iss`, base of discovery
      audience: []               # REQUIRED with oidc modes: accepted `aud` values
      jwks_uri: null             # null: read from <issuer>/.well-known/openid-configuration
      algorithms: [RS256, ES256] # asymmetric algorithms only
      clock_skew_s: 60           # tolerance for exp, nbf and iat
      jwks_cache_ttl_s: 300      # signing keys are refreshed after this long
      jwks_min_refresh_s: 30     # shortest time between key refreshes (unknown key id, errors)
      http_timeout_s: 5          # timeout of provider requests
      subject_claim: sub
      name_claims: [name, preferred_username, email]   # display name, in order of preference
      groups_claim: groups       # claim with provider group names (matched to groups)
      auto_provision: true       # create the user on the first valid token
      principal_cache_ttl_s: 60  # reuse of a subject's principal and groups
      principal_cache_max_entries: 4096
    authz:
      grants_cache_ttl_s: 15     # grants are cached this long; other processes see changes after
                                 # at most this; 0 disables
      grants_cache_max_entries: 2048
      custom_roles: {}           # extra roles, name -> permissions. Built-in roles: viewer,
                                 # explorer, editor, operator, modeler, reviewer, maintainer,
                                 # admin, agent-reader. Example:
                                 #   contributor: [schema.read, data.read, branch.create]
                                 # Permissions: schema.read data.read views.write branch.create
                                 # operation.execute operation.execute_custom schema.write
                                 # source.map proposal.review conflict.resolve proposal.merge
                                 # source.manage job.manage grant.manage apikey.manage
                                 # domain.settings domain.delete audit.read
                                 # principal.read domain.create (the last two are
                                 # installation-level)
    audit:
      enabled: true              # hash-chained log of mutations and denied requests; needs the
                                 # `database` section
      record_denied: true        # also record requests rejected with 401 or 403
      write_timeout_s: 2         # a failed or slow write is logged and counted, never surfaced
  openapi:
    title: Lorebase Keeper
    docs_enabled: true           # serve <prefix>/docs and <prefix>/openapi.json
  domains:
    leaf_size: 512               # tree leaf size of new Domains, fixed for a Domain's life
    creator_role: admin          # role granted to the creator in a new Domain; null: none
    protect_default_branch: true # the default branch accepts changes only through Proposals
  branches:
    materialization: full        # M1 supports full only: rows copied from the source head or
                                 # rebuilt from the tree of the start Revision
    max_materialized_per_domain: 20
    name_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$'
    max_name_length: 200
    lock_retry_after_s: 1        # Retry-After of 503 branch-busy answers
  schema_changes:
    max_issues: 200              # issues listed in one response
    max_listed_changes: 1000     # element changes listed in one response
  schema_inference:              # POST /domains/{d}/schema:infer (docs/inference.md)
    max_files: 50                # CSV/TSV files per request
    max_file_bytes: 1048576      # per file (413 above); uploads also obey limits.max_request_body_bytes
    max_total_bytes: 1048576     # all files together (413 above)
    file_suffixes: [.csv, .tsv, .txt]
    allowed_sources: []          # secret references of Postgres URLs callers may name, e.g.
                                 # secret://env/ERP_DSN; empty disables Postgres inference
    max_issues: 500              # issues listed in one response
    options:                     # thresholds and naming rules; a request may override them
      sample_size: 10000         # values read per column
      null_tokens: ["", "NULL", "null"]   # text read as null (after trimming)
      trim_text: true
      max_evidence_samples: 5    # sample values kept per evidence entry
      min_support_values: 20     # non-null values for full confidence; fewer scale it down
      sampled_uniqueness_factor: 0.8   # confidence factor when only a sample was read
      true_tokens: ["true", "t", "yes", "y"]     # boolean tokens, case-insensitive
      false_tokens: ["false", "f", "no", "n"]
      type_tolerance: 0.0        # share of values allowed not to parse as the detected type
      mixed_type_report_ratio: 0.5     # report text columns that mostly parse as one type
      leading_zero_integers_as_text: true   # 007 stays a text code
      decimal_max_scale: 4       # more fractional digits: float
      decimal_precision_headroom: 2    # integer digits added to the largest seen
      decimal_max_precision: 38
      date_formats: ["%Y-%m-%d"]
      timestamp_formats: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S"]   # without offset: UTC;
                                 # RFC 3339 with offset is always recognized
      enum_max_cardinality: 12   # enum: at most this many distinct values,
      enum_max_distinct_ratio: 0.5     # at most this distinct/non-null ratio,
      enum_min_values: 10        # at least this many non-null values,
      enum_max_value_length: 40  # and short values (numbered codes such as a-1, a-2 never)
      text_min_length: 256       # longer values: text
      text_name_hints: [description, "*_description", summary, reason, notes, note, comment,
                        comments, body, content, details]   # prose under these names: text
      text_hint_min_words: 3.0
      string_length_buckets: [16, 32, 64, 128, 256]   # max_length rounded up to a bucket
      propose_max_length: true
      propose_patterns: true     # e.g. ^S-[0-9]{4,}$ for code-like values
      pattern_min_values: 5
      propose_non_negative_min: true   # min 0 on numbers that are never negative
      required_max_null_ratio: 0.0     # at most this share of nulls: required
      unique_min_values: 2
      unique_name_patterns: ["*_number", "*_code", "*_id", "*_key", email, "*_email", "vat*",
                             iban]   # unique non-key columns flagged unique only when named so
      key_name_patterns: [id, key, code, "{table}_id", "{table}_key", "{table}_code",
                          "{table}_number", "{table}_no", "*_id", "*_key", "*_code",
                          "*_number", "*_no"]   # ranked primary key names
      allow_unnamed_primary_key: true    # else the first unique, never-null column
      composite_key_max_columns: 2
      minted_key_columns: [key]  # key column of generated ids (ULID, UUID): minted keys
      min_inclusion_ratio: 0.95  # share of a column's values found in a key for a Relation
      foreign_key_suffixes: [_id, _key, _code, _number, _no, _ref, _fk]
      integer_reference_needs_name: true
      weak_name_factor: 0.9      # confidence factor: reference suffix without the target name
      no_name_factor: 0.75       # confidence factor: no name hint at all
      detect_junction_tables: true     # two references forming the key: a Relation
      junction_max_attributes: 8
      one_to_one_needs_declared_unique: true
      singular_kind_names: true  # suppliers -> Supplier
      strip_table_prefixes: []   # e.g. [tbl_]
      title_names: [name, title, label, display_name, "*_name", "*_title", "*_label"]
      propose_search: true       # title searchable (A), text Attributes searchable (B)
      reserved_attribute_names: [key, kind, ref, revision]   # renamed <kind>_<column>
      element_status: draft      # status of proposed Kinds and Relations
      id_seed: lorebase.infer    # same input and seed: same ids
      id_timestamp_ms: 0
  operations:
    max_bulk_rows: 10000         # rows accepted by one import_records or import_links call
    import_batch_rows: 1000      # rows committed per Revision by bulk imports
    dry_run_max_edits: 1000      # edits listed in a response; longer lists are cut
    max_issues: 200              # violations listed in one response
    direct_commit_on_protected: false   # true: Operations with review policy `never` commit
                                        # directly to protected branches
    skip_expression_preconditions: false   # with expressions off: true skips CEL
                                           # preconditions (reported) instead of refusing
    expressions_enabled: false   # true: stored Operations evaluate CEL preconditions, review
                                 # policies and steps (lorebase_core.expr); false: refused
    expression_limits:           # budget of one expression (lorebase_core.expr.ExprLimits)
      max_source_length: 4096    # characters of expression source
      max_depth: 48              # nesting depth of the expression tree
      max_steps: 10000           # evaluation steps, comprehension iterations included
      max_duration_ms: 250       # wall-clock safety net behind max_steps
      max_list_size: 10000       # elements of a list or map built during evaluation
      max_string_length: 65536   # characters of a string built during evaluation
      max_record_lookups: 100    # Records read through record() in one evaluation
      decimal_precision: 34      # significant digits of decimal arithmetic
  proposals:                     # a Domain overrides required_approvals with its own
                                 # `required_approvals` setting; its `merge_policy` setting
                                 # holds the merge policy options of new Proposals
    required_approvals: 1        # approvals needed to merge into a protected branch
    allow_self_approval: false   # authors may approve their own Proposals into protected branches
    changes_requested_blocks: true   # an outstanding request_changes review blocks such merges
    auto_close_source_branch: false  # delete the source branch after the merge (never the
                                     # default or a protected branch)
    attempt_retention: 5         # merge attempts kept per Proposal (merged ones always kept)
    preview_on_create: true      # compute the merge preview (Conflict count) on creation
    max_resolutions: 1000        # resolutions accepted by one bulk request

# Model inference, used by Scribe only. Lorebase never imports a model vendor library: every
# chat model is an OpenAI-compatible HTTP endpoint, local or hosted.
inference:
  llm:                           # tier 2; env aliases LLM_BASE_URL, LLM_MODEL, LLM_API_KEY
    provider: openai_compatible  # openai_compatible | fake
    base_url: http://localhost:11434/v1   # local Ollama; in docker compose: http://ollama:11434/v1
    model: qwen2.5:7b-instruct   # any model name the endpoint serves
    api_key: null                # hosted endpoints: secret://env/LLM_API_KEY
    structured_output: json_schema        # json_schema | json_mode
    temperature: 0
    max_concurrency: 2
    timeout_s: 120
    price_per_million_tokens: {input: 0, output: 0}   # zero for local models
    tasks: {}                    # per-task overrides, see the commented example below

    # Hosted OpenAI-compatible endpoint (OpenAI, Azure OpenAI, Mistral, ...):
    #   base_url: https://api.openai.com/v1
    #   model: <model name>
    #   api_key: secret://env/LLM_API_KEY
    #   price_per_million_tokens: {input: <price>, output: <price>}
    #
    # LiteLLM proxy (compose profile `litellm`), reaching Anthropic, Google, Bedrock, ...:
    #   base_url: http://litellm:4000/v1
    #   model: <model alias defined in the proxy>
    #   api_key: secret://env/LITELLM_KEY
    #
    # Small local model for bulk extraction, larger hosted model for schema discovery:
    #   tasks:
    #     extraction: {model: qwen2.5:7b-instruct}
    #     schema_discovery:
    #       base_url: https://api.openai.com/v1
    #       model: <model name>
    #       api_key: secret://env/HOSTED_KEY

  embeddings:
    provider: fastembed          # fastembed | openai_compatible | fake
    model: BAAI/bge-small-en-v1.5
    dims: 384                    # must match the model; the vector index uses it
    base_url: null               # required for openai_compatible (Ollama or hosted)
    api_key: null

  local_extractors:              # tier 1; check each checkpoint's weight license
    provider: gliner             # gliner | fake
    gliner: {enabled: true, model: urchade/gliner_multi-v2.1, threshold: 0.5}
    glirel: {enabled: true, model: jackboyla/glirel-large-v0, threshold: 0.5}
    spacy: {enabled: false, pipeline: en_core_web_sm}

  # Deterministic provider for tests and offline runs: set `provider: fake` in llm,
  # embeddings and local_extractors. No network access is needed.
  fake:
    fixtures_dir: null           # directory of <prompt-hash>.json canned chat answers
    dictionary: {}               # label -> surface forms matched by the fake span extractor
    max_schema_depth: 6          # nesting depth beyond which optional properties are omitted

# Postgres 16 with the pgvector extension. Environment: LOREBASE__DATABASE__DSN, ...
database:
  dsn: postgresql+asyncpg://lorebase@localhost:5432/lorebase
                                 # alias LOREBASE_DB_DSN; e.g. secret://env/LOREBASE_DB_DSN.
                                 # postgresql:// URLs are switched to the asyncpg driver; without
                                 # a password, PGPASSWORD or ~/.pgpass is used
  pool_size: 10                  # connections kept open per process
  max_overflow: 10               # extra connections under load
  pool_timeout_s: 30             # wait for a free pooled connection
  pool_recycle_s: 1800           # replace older connections; -1 never
  statement_timeout_ms: 30000    # per statement; 0 disables
  migration_statement_timeout_ms: 0   # while migrations run; 0 disables
  application_name: lorebase     # shown in pg_stat_activity
  read_dsn: []                   # read replicas (docs/deployment.md): one URL, a comma-separated
                                 # string or a list; literals or secret references, e.g.
                                 # [secret://env/LOREBASE_DB_READ_DSN]. Alias LOREBASE_DB_READ_DSN.
                                 # Reads are spread round-robin; empty keeps every read on the
                                 # primary. Each replica gets its own pool, sized as above
  read_max_lag_ms: 5000          # a replica lagging more than this serves no reads; 0: unchecked
  read_fallback_to_primary: true # reads no replica can serve go to the primary; false: 503
  read_probe_timeout_ms: 2000    # budget to reach a replica and run its freshness probe
  prepared_statement_cache_size: 500  # prepared statements per connection (asyncpg); 0 disables

# Storage engine. `layout` and `embeddings` are read once by the initial migration; the other
# keys are read at runtime.
store:
  layout:
    hash_partitions: 8           # domain_id hash partitions of objects, tree_nodes, mat_records
                                 # and mat_links
  embeddings:
    dims: 384                    # HNSW index dimension; must equal inference.embeddings.dims
  writes:
    insert_batch_rows: 1000      # rows per multi-row INSERT
    copy_threshold_rows: 5000    # larger batches use COPY into a staging table; 0 disables COPY
  nodes:
    cache_bytes: 67108864        # in-process LRU cache of tree nodes (64 MiB); 0 disables it
    prefetch_batch: 1000         # node hashes per prefetch query
  commit:
    lock_timeout_ms: 10000       # wait for the branch lock before failing; 0 waits forever
    prefetch_batch: 1000         # keys per query when validation prefetches materialized rows
  materialize:
    text_search_config: simple   # Postgres text search configuration of Record search vectors
    read_batch_rows: 5000        # rows or object bodies per query in rebuild and verification
    verify_max_divergences: 1000 # divergences listed by a verification report
  gc:                            # garbage collection (docs/operations.md)
    grace_seconds: 3600          # Revisions younger than this are kept with all they reach
    mark_batch: 1000             # tree node hashes per query while marking
    sweep_batch_rows: 5000       # rows deleted per transaction while sweeping
    guard_branch_locks: true     # hold every branch lock (try-lock) around each sweep batch
    max_guarded_branches: 500    # refs one sweep batch may lock; more refs need a larger value
    guard_wait_seconds: 60       # wait for in-flight commits before the collection stops
    guard_retry_ms: 200          # pause between lock attempts
  jobs:                          # job queue workers
    max_attempts: 3              # runs of a job before it is marked failed
    retry_delay_seconds: 60      # delay before a failed job runs again
    stale_after_seconds: 3600    # running jobs locked longer than this are requeued
  bundle:                        # Domain export and import (docs/operations.md)
    batch_rows: 5000             # rows read, written or verified per batch
    compression: gzip            # gzip | none, applied to the .jsonl files
    compression_level: 6         # gzip level 1-9
    verify_after_import: true    # verify rebuilt branches against their trees
  profiling:                     # profilers feeding schema inference (docs/inference.md)
    csv:
      sample_rows: 10000         # rows kept per file; every row is still counted
      sampling: reservoir        # head (first rows) | reservoir (uniform, seeded, file order)
      seed: 0                    # reservoir seed: the same file gives the same rows
      encodings: [utf-8-sig, cp1252]   # tried in order
      sniff_bytes: 65536         # leading bytes used to detect the delimiter
      delimiters: ",;\t|"        # delimiters the sniffer may pick; .tsv files use a tab
      max_columns: 500           # wider files are refused
    postgres:
      sample_rows: 10000         # rows read per table (LIMIT), in a read-only transaction
      max_tables: 200            # tables profiled per request
      statement_timeout_ms: 15000
      exact_row_count: false     # true: count(*) per table; false: planner estimate

  indexes:                       # per-Attribute partial indexes on mat_records
    enabled: true                # false: an administrator manages them; a commit role that does
                                 # not own mat_records skips them too (warning logged)
    inline_max_rows: 50000       # larger Kinds get their indexes from a queued concurrent build
    job_batch: 10                # queued index jobs claimed per runner pass
  reads:
    schema_cache_entries: 256    # compiled schemas per process, keyed by head Revision id
    max_page_rows: 500           # largest page of Records, Links or query results
    max_search_rows: 100         # largest full-text search result
    search_candidates: 1000      # matches ranked per search (bounds very common terms)
    max_hydrate_keys: 1000       # Records per batched hydration
  traverse:                      # neighborhood caps
    max_depth: 3                 # hops
    max_seeds: 50                # seed Records
    max_fanout: 50               # Links followed per Record and hop
    max_links: 2000              # Links walked, breadth first
    max_nodes: 200               # Records returned, nearest first
# Read path of Keeper (design 8). Reads hit the materialized head of a branch; `at=<revision>`
# reads go through the Revision tree.
read:
  records:                       # pages of Records and Links
    default_limit: 50
    max_limit: 500
  log:                           # pages of a branch log
    default_limit: 50
    max_limit: 500
  statement_timeout_ms: 2000     # statement_timeout of read transactions; 0 disables
  schema_cache_entries: 64       # compiled schemas kept in memory, by schema hash
  query:                         # limits of the query DSL
    max_via_depth: 3             # nesting of via and count predicates
    max_predicates: 64
    max_in_values: 1000
    max_order_terms: 4
    max_includes: 5              # Relations in `include`
    include_default_limit: 10    # neighbors per Record in `include`
    include_max_limit: 50
    max_aggregate_groups: 1000   # groups returned by `aggregate`; more are cut
  traverse:                      # POST /traverse and POST /neighborhood
    max_hops: 5
    max_nodes_per_hop: 1000
    max_seeds: 100
    max_depth: 3
    max_nodes: 2000
    max_edges: 5000
  time_travel:
    max_scan_entries: 100000     # largest Kind or Relation partition listed at a Revision
  diff:
    max_changes: 100000          # larger diffs are refused; narrow them with kinds/relations
    page:
      default_limit: 100
      max_limit: 1000

# Search (design 8.4). Keeper never computes embeddings: semantic and hybrid search take the
# caller's query_vector. The text search configuration is store.materialize.text_search_config
# and the vector dimension store.embeddings.dims.
search:
  results:
    default_limit: 20
    max_limit: 100
  candidates: 200                # rows of each ranked list before fusion and paging
  trigram_threshold: 0.3         # least title similarity for a typo-tolerant hit
  trigram_weight: 0.5            # weight of title similarity added to ts_rank_cd
  headline_options: "MaxWords=30, MinWords=10, MaxFragments=2"   # ts_headline of snippets
  semantic:
    model: BAAI/bge-small-en-v1.5   # embedding model searched; equals inference.embeddings.model
  hybrid:                        # reciprocal rank fusion: w / (rrf_k + rank) per list
    rrf_k: 60
    lexical_weight: 1.0
    semantic_weight: 1.0

# Agent-facing reads (docs/agents.md). Context packs are also bounded by read.traverse;
# nothing here calls a model.
agents:
  context:                       # POST /domains/{d}/context
    default_budget_tokens: 4000  # estimated token budget when the request gives none
    max_budget_tokens: 32000
    chars_per_token: 4.0         # estimate: tokens = ceil(characters / chars_per_token)
    default_depth: 1             # neighborhood depth when the request gives none
    max_depth: 2
    max_seeds: 20                # seed Records of one pack
    max_neighbors: 200           # Records around the seeds
    max_links: 500
    recent_changes_max: 50       # change entries read before trimming, newest first
    trim_order:                  # sections trimmed, in this order, to fit the budget
      - lineage
      - recent_changes
      - far_neighbor_values
      - far_neighbors
      - schema_descriptions
      - near_neighbor_values
      - near_neighbors
      - schema
  explain:                       # GET /domains/{d}/kinds/{kind}/records/{key}/explain
    max_links: 100               # Links listed with their origin
    max_proposals: 20            # Proposals that changed the Record
  feed:                          # GET .../branches/{b}/events (SSE) and .../changes
    poll_interval_s: 1.0         # how often an open stream looks for new events
    heartbeat_s: 15.0            # comment line after this much silence
    max_connection_s: 300.0      # streams close after this long; clients resume with Last-Event-ID
    retry_ms: 3000               # reconnection delay advised to clients
    batch_events: 100            # events read per poll
    changed_keys_max: 100        # changed Record keys listed per event
    changes:                     # pages of GET .../changes
      default_limit: 50
      max_limit: 500
    max_scan: 10000              # first-parent Revisions walked back to find `since`

# Webhooks (design 10.5): managed through Keeper, delivered from the outbox by
# lorebase_store.webhooks.deliver_pending (run periodically by a worker).
webhooks:
  allowed_schemes: [https]       # URL schemes a webhook may use
  allow_private_targets: false   # refuse loopback, private and link-local targets
  max_per_domain: 20
  secret_bytes: 32               # random bytes of a new signing secret
  signature_header: Lorebase-Signature   # t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">
  event_header: Lorebase-Event
  delivery_header: Lorebase-Delivery
  timeout_s: 10.0                # time budget of one request
  max_attempts: 8                # then the delivery is marked dead
  backoff_base_s: 30.0           # delay after the first failure ...
  backoff_factor: 2.0            # ... multiplied by this after each next one ...
  backoff_max_s: 3600.0          # ... up to this
  lease_s: 120.0                 # a claimed delivery is retried by another worker after this
  batch: 100                     # events and deliveries per worker pass
  changed_keys_max: 100          # changed Record keys listed per event payload
  retention_s: 604800.0          # finished deliveries and handed-off events kept (7 days)

# Herald, the MCP server (design 11.2; docs/mcp.md). Short variables set by MCP host
# configurations: LOREBASE_URL (keeper.base_url), LOREBASE_API_KEY (keeper.api_key),
# LOREBASE_DOMAIN (domain), LOREBASE_BRANCH (branch).
herald:
  transport: stdio               # stdio or streamable_http
  server_name: lorebase
  domain: null                   # Domain used when a call names none
  branch: null                   # null: the Domain's default branch
  log_level: WARNING             # log level of the MCP SDK
  keeper:
    base_url: http://127.0.0.1:8080
    api_prefix: /api/v1
    api_key: null                # stdio only: the agent's key, e.g. secret://env/AGENT_API_KEY
    timeout_s: 30
    verify_tls: true
    user_agent: lorebase-herald
  http:                          # streamable_http: each caller sends its own key
    host: 127.0.0.1
    port: 8090
    path: /mcp
    stateless: true
    json_response: true
    allowed_hosts: []            # e.g. [herald.example.com]; empty: SDK default for the host
    allowed_origins: []
    credential_header: Authorization
  output:
    default_format: text         # text (compact) or json
    max_chars: 12000             # longer outputs are cut with a [truncated ...] marker
    max_items: 50
    max_value_chars: 240
    max_issues: 20
  context:                       # lorebase_context packs
    token_budget: 3000
    max_token_budget: 20000
    chars_per_token: 4.0
    depth: 1
    max_nodes: 40
    max_edges: 80
    max_seeds: 5
    search_seeds: 3
  neighborhood:
    default_depth: 1
    max_depth: 3
    default_max_nodes: 50
    max_nodes: 500
    max_edges: 1000
    max_seeds: 20
  changes:
    page_size: 50
    max_pages: 10

# Scribe, the job worker: webhook delivery, queued index builds and garbage collection.
# Job retries and stale locks: store.jobs.
scribe:
  worker:
    concurrency: 2               # jobs run at the same time by one process
    poll_interval_s: 2.0         # pause of an idle slot before it looks for jobs again
    heartbeat_interval_s: 60.0   # running jobs refresh their lock this often (< stale_after_seconds)
    shutdown_grace_s: 30.0       # on SIGTERM, running jobs get this long, then go back to the queue
    statement_timeout_ms: 0      # Scribe's own connections; 0 disables (GC and index builds run long)
    principal: svc_scribe        # author of Scribe's commits and Proposals
    types: []                    # job types this process runs; empty: all of them
  scheduler:                     # one process at a time is leader (Postgres advisory lock)
    enabled: true
    tick_s: 15.0                 # interval between scheduling passes
    lock_name: lorebase.scribe.scheduler   # hashed into the advisory lock key
    webhook_interval_s: 10.0     # webhook delivery pass (retries included); 0 disables
    index_interval_s: 60.0       # pass of the queued per-Attribute index builds; 0 disables
    gc_schedule: "0 3 * * *"     # cron (UTC) of the collection of every Domain; null disables
    gc_dry_run: false
    source_schedules: true       # queue Source synchronizations from each Source's `schedule`
    domain_batch: 100            # Domains read per query
