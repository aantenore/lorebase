[project]
name = "lorebase"
version = "0.1.0"
description = "Lorebase workspace root: shared tooling configuration"
requires-python = ">=3.12"
dependencies = [
  "lorebase-core",
  "lorebase-platform",
  "lorebase-inference",
  "lorebase-store",
  "lorebase-keeper",
  "lorebase-client",
  "lorebase-cli",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "import-linter>=2.0",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lorebase-core = { workspace = true }
lorebase-platform = { workspace = true }
lorebase-inference = { workspace = true }
lorebase-store = { workspace = true }
lorebase-keeper = { workspace = true }
lorebase-client = { workspace = true }
lorebase-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "PT", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = [
  "lorebase_core",
  "lorebase_platform",
  "lorebase_inference",
  "lorebase_store",
  "lorebase_keeper",
  "lorebase_client",
  "lorebase_cli",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/core/src",
  "packages/platform/src",
  "packages/inference/src",
  "packages/store/src",
  "packages/keeper/src",
  "packages/client/src",
  "packages/cli/src",
]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "integration: needs external services such as Postgres",
  "perf: performance baseline; needs Postgres, runs only with -m perf",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
