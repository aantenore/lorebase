[project]
name = "lorebase-inference"
version = "0.4.0"
description = "Lorebase inference: model-agnostic chat, embedding and span extraction providers"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Antenore" }]
keywords = ["ontology", "knowledge-graph", "mcp", "postgres", "versioning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "lorebase-platform>=0.4,<0.5",
  "httpx>=0.27",  # HTTP client of the compatible-endpoint providers; no vendor SDK
  "jsonschema>=4.22",  # local validation of model answers against the requested schema
]

# Local models run in-process on CPU and are optional: the default stack also works with a
# compatible HTTP endpoint for chat and embeddings.
[project.optional-dependencies]
# ONNX embeddings (default embedding provider). Pulls onnxruntime, no PyTorch.
fastembed = ["fastembed>=0.4"]
# Zero-shot span and relation models. Pull PyTorch and transformers (large download). Weights
# are fetched from the model hub on first use and carry their own licenses.
local-extractors = ["gliner>=0.2", "glirel>=1.0"]

[project.scripts]
lorebase-inference = "lorebase_inference.cli:main"

[project.urls]
Homepage = "https://github.com/aantenore/lorebase"
Documentation = "https://aantenore.github.io/lorebase/"
Repository = "https://github.com/aantenore/lorebase"
Changelog = "https://github.com/aantenore/lorebase/blob/main/CHANGELOG.md"
Issues = "https://github.com/aantenore/lorebase/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_inference"]
