[project]
name = "lorebase-inference"
version = "0.1.0"
description = "Lorebase inference: model-agnostic chat, embedding and span extraction interfaces"
requires-python = ">=3.12"
dependencies = ["lorebase-platform"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_inference"]
