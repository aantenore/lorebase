[project]
name = "lorebase-scribe"
version = "0.2.3"
description = "Lorebase Scribe: job worker, scheduler and Source synchronization"
requires-python = ">=3.12"
# lorebase-store: job queue, commit pipeline, merges, webhooks, index jobs and GC.
# lorebase-inference: model interfaces for the extraction jobs to come.
# httpx: webhook deliveries, CSV Sources served over HTTP(S) and http_json Sources.
# asyncpg and sqlalchemy: reading Postgres Sources (the drivers the store already uses).
dependencies = [
  "lorebase-core>=0.2,<0.3",
  "lorebase-platform>=0.2,<0.3",
  "lorebase-store>=0.2,<0.3",
  "lorebase-inference>=0.2,<0.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pydantic>=2.7",
  "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
# documents: parsers for extraction jobs (design 9.2 step 2). Markdown and plain text need
# nothing; pypdf reads the text layer of PDF files (BSD-3-Clause, pure Python) and python-docx
# reads Word documents (MIT). Without them those media types fail with a message naming this
# extra.
documents = ["pypdf>=4.2", "python-docx>=1.1"]
# parquet: pyarrow (Apache-2.0) reads parquet Sources batch by batch. Without it those Sources
# fail with a message naming this extra.
parquet = ["pyarrow>=15"]
# mysql: asyncmy (Apache-2.0, async, prebuilt wheels) reads MySQL and MariaDB Sources through
# SQLAlchemy. Without it those Sources fail with a message naming this extra.
mysql = ["asyncmy>=0.2.10"]
# mssql: pymssql (LGPL-2.1, FreeTDS bundled in the wheels, no ODBC driver to install) reads SQL
# Server Sources through SQLAlchemy in worker threads. Without it those Sources fail with a
# message naming this extra.
mssql = ["pymssql>=2.3"]

[dependency-groups]
# Disposable MySQL and SQL Server servers for the integration tests of those Sources.
dev = ["testcontainers[mysql,mssql]>=4.8"]

[project.scripts]
lorebase-scribe = "lorebase_scribe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_scribe"]
