[project]
name = "lorebase-platform"
version = "0.3.0"
description = "Lorebase platform: settings, secrets, logging and telemetry"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Antenore" }]
keywords = ["ontology", "knowledge-graph", "mcp", "postgres", "versioning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3", "pyyaml>=6.0", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-grpc>=1.25"]

[project.urls]
Homepage = "https://github.com/aantenore/lorebase"
Documentation = "https://aantenore.github.io/lorebase/"
Repository = "https://github.com/aantenore/lorebase"
Changelog = "https://github.com/aantenore/lorebase/blob/main/CHANGELOG.md"
Issues = "https://github.com/aantenore/lorebase/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_platform"]
