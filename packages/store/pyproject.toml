[project]
name = "lorebase-store"
version = "0.4.0"
description = "Lorebase store: persistence, repositories, migrations and materializer"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Antenore" }]
keywords = ["ontology", "knowledge-graph", "mcp", "postgres", "versioning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "lorebase-core>=0.4,<0.5",
  "lorebase-platform>=0.4,<0.5",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "opentelemetry-api>=1.25",
  "cryptography>=42",  # AES-GCM and HKDF of lorebase_store.keyring
]

[dependency-groups]
dev = ["testcontainers[postgres]>=4.8"]

[project.urls]
Homepage = "https://github.com/aantenore/lorebase"
Documentation = "https://aantenore.github.io/lorebase/"
Repository = "https://github.com/aantenore/lorebase"
Changelog = "https://github.com/aantenore/lorebase/blob/main/CHANGELOG.md"
Issues = "https://github.com/aantenore/lorebase/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_store"]

# Ship the Alembic environment so installed services can resolve the expected head revisions.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "lorebase_store/_migrations"
