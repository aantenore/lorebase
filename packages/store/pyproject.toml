[project]
name = "lorebase-store"
version = "0.1.0"
description = "Lorebase store: persistence, repositories, migrations and materializer"
requires-python = ">=3.12"
dependencies = [
  "lorebase-core>=0.1,<0.2",
  "lorebase-platform>=0.1,<0.2",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "opentelemetry-api>=1.25",
  "cryptography>=42",  # AES-GCM and HKDF of lorebase_store.keyring
]

[dependency-groups]
dev = ["testcontainers[postgres]>=4.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_store"]

# Ship the Alembic environment so installed services can resolve the expected head revisions.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "lorebase_store/_migrations"
