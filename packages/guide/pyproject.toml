[project]
name = "lorebase-guide"
version = "0.2.3"
description = "Lorebase Guide: optional exploration assistant and query embedding over Keeper"
requires-python = ">=3.12"
# lorebase-inference: the chat model of the exploration agent and the embedding model of /embed.
# lorebase-client: every read goes to Keeper with the caller's own credential.
# lorebase-platform: layered settings, secret references, structured logs and telemetry.
# fastapi and uvicorn: the HTTP service (JSON for /embed, server-sent events for /explore).
dependencies = [
  "lorebase-platform>=0.2,<0.3",
  "lorebase-inference>=0.2,<0.3",
  "lorebase-client>=0.2,<0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
# In-process ONNX embeddings (the default embedding provider of the inference settings).
fastembed = ["lorebase-inference[fastembed]>=0.2,<0.3"]

[project.scripts]
lorebase-guide = "lorebase_guide.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_guide"]
