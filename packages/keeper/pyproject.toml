[project]
name = "lorebase-keeper"
version = "0.1.0"
description = "Lorebase Keeper: REST API service"
requires-python = ">=3.12"
dependencies = ["lorebase-store"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_keeper"]
