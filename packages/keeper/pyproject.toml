[project]
name = "lorebase-keeper"
version = "0.1.0"
description = "Lorebase Keeper: REST API service"
requires-python = ">=3.12"
dependencies = [
  "lorebase-store",
  "lorebase-platform",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "opentelemetry-api>=1.25",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "python-multipart>=0.0.9",  # form parser of Starlette: CSV uploads of POST schema:infer
]

[project.scripts]
lorebase-keeper = "lorebase_keeper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_keeper"]
