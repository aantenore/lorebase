[project]
name = "lorebase-keeper"
version = "0.4.0"
description = "Lorebase Keeper: REST API service"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Antenore" }]
keywords = ["ontology", "knowledge-graph", "mcp", "postgres", "versioning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "lorebase-core>=0.4,<0.5",
  "lorebase-store>=0.4,<0.5",
  "lorebase-platform>=0.4,<0.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "opentelemetry-api>=1.25",
  "asyncpg>=0.29",  # readiness probe of the database (imported lazily)
  "pgvector>=0.3",  # vector column types of semantic search
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "python-multipart>=0.0.9",  # form parser of Starlette: file uploads of POST schema:infer
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]  # Parquet uploads of POST schema:infer and schema:preview
mysql = ["asyncmy>=0.2.10"]  # MySQL and MariaDB sources of POST schema:infer
mssql = ["pymssql>=2.3"]  # SQL Server sources of POST schema:infer

[project.scripts]
lorebase-keeper = "lorebase_keeper.__main__:main"

[project.urls]
Homepage = "https://github.com/aantenore/lorebase"
Documentation = "https://aantenore.github.io/lorebase/"
Repository = "https://github.com/aantenore/lorebase"
Changelog = "https://github.com/aantenore/lorebase/blob/main/CHANGELOG.md"
Issues = "https://github.com/aantenore/lorebase/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_keeper"]
