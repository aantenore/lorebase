[project]
name = "lorebase-core"
version = "0.2.3"
description = "Lorebase core: pure domain logic and versioning engine"
requires-python = ">=3.12"
dependencies = [
    "cel-python>=0.5",
    "google-re2>=1.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_core"]
