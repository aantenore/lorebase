[project]
name = "lorebase-client"
version = "0.3.1"
description = "Lorebase client: typed sync and async HTTP client for the Keeper API"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Antenore" }]
keywords = ["ontology", "knowledge-graph", "mcp", "postgres", "versioning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  # Transport: one HTTP stack with sync and async clients and pluggable transports.
  "httpx>=0.27",
  # Typed request and response models.
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/aantenore/lorebase"
Documentation = "https://aantenore.github.io/lorebase/"
Repository = "https://github.com/aantenore/lorebase"
Changelog = "https://github.com/aantenore/lorebase/blob/main/CHANGELOG.md"
Issues = "https://github.com/aantenore/lorebase/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorebase_client"]
