# nginx configuration of the web image. The Helm chart (templates/web-configmap.yaml) mounts an
# equivalent file over this one, with the port and the cache lifetime from its values.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime configuration: never cached, so a changed Keeper URL applies on the next load.
  location = /config.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff";
  }

  # Built assets carry a content hash in their name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Single page application: unknown paths load the shell.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "same-origin";
    try_files $uri $uri/ /index.html;
  }
}
