# nginx configuration of the web image. The Helm chart (templates/web-configmap.yaml) mounts an
# equivalent file over this one, with the port, the cache lifetime and the security headers from
# its values.
#
# The security headers (Content-Security-Policy and others) are in the included file, written
# when the container starts by 40-lorebase-config.sh. They are included in every location
# because add_header of a location replaces those of the server block.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime configuration: never cached, so a changed Keeper URL applies on the next load.
  location = /config.js {
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/lorebase-security-headers.inc;
  }

  # Built assets carry a content hash in their name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/lorebase-security-headers.inc;
    try_files $uri =404;
  }

  # Single page application: unknown paths load the shell.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/lorebase-security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}
