# Minimal OpenTelemetry Collector pipeline for the `observability` compose profile.
# Lorebase services export OTLP/gRPC here; traces go to Jaeger, metrics are exposed for
# Prometheus to scrape. Replace the exporters to send telemetry anywhere else.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
