# Prometheus alert rules of Lorebase. Every metric used here is listed in docs/metrics.md;
# every alert has a runbook entry in docs/operations.md ("Dashboards and alerts").
#
# Thresholds are starting points. Change the numbers in the expressions to fit your traffic.
# Route classes mirror the rate limit classes of Keeper (reads, queries, searches, context,
# writes); the class `admin` is chosen by OpenAPI tag, which the metric does not carry.

groups:
  - name: lorebase-keeper
    rules:
      # p95 budgets per route class, over 10 minutes. The latency histogram declares a bucket
      # boundary at every budget (see "Histogram buckets" in docs/metrics.md).
      - alert: LorebaseKeeperLatencyOverBudget
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method=~"GET|HEAD|OPTIONS",http_route!~".*/(healthz|readyz)"}[10m]))) > 0.1
        for: 10m
        labels:
          severity: warning
          component: keeper
          route_class: reads
        annotations:
          summary: "Keeper read p95 above 100 ms"
          description: "p95 of GET requests has been {{ $value | humanizeDuration }} for 10 minutes (budget 100 ms)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeeperlatencyoverbudget"
      - alert: LorebaseKeeperLatencyOverBudget
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method="POST",http_route=~".*/(query|traverse|neighborhood)"}[10m]))) > 0.25
        for: 10m
        labels:
          severity: warning
          component: keeper
          route_class: queries
        annotations:
          summary: "Keeper query, traverse and neighborhood p95 above 250 ms"
          description: "p95 of read POSTs has been {{ $value | humanizeDuration }} for 10 minutes (budget 250 ms)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeeperlatencyoverbudget"
      - alert: LorebaseKeeperLatencyOverBudget
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method="POST",http_route=~".*/search"}[10m]))) > 0.25
        for: 10m
        labels:
          severity: warning
          component: keeper
          route_class: searches
        annotations:
          summary: "Keeper search p95 above 250 ms"
          description: "p95 of search requests has been {{ $value | humanizeDuration }} for 10 minutes (budget 250 ms)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeeperlatencyoverbudget"
      - alert: LorebaseKeeperLatencyOverBudget
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method="POST",http_route=~".*/context"}[10m]))) > 1
        for: 10m
        labels:
          severity: warning
          component: keeper
          route_class: context
        annotations:
          summary: "Keeper context pack p95 above 1 s"
          description: "p95 of context pack requests has been {{ $value | humanizeDuration }} for 10 minutes (budget 1 s)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeeperlatencyoverbudget"
      - alert: LorebaseKeeperLatencyOverBudget
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method=~"POST|PUT|PATCH|DELETE",http_route!~".*/(query|traverse|neighborhood|search|context)"}[10m]))) > 2.5
        for: 10m
        labels:
          severity: warning
          component: keeper
          route_class: writes
        annotations:
          summary: "Keeper write p95 above 2.5 s"
          description: "p95 of write requests has been {{ $value | humanizeDuration }} for 10 minutes (budget 2.5 s)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeeperlatencyoverbudget"

      - alert: LorebaseKeeperHighErrorRatio
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count[5m])) > 0.05
          and sum(rate(http_server_request_duration_seconds_count[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: keeper
        annotations:
          summary: "More than 5% of Keeper responses are 5xx"
          description: "{{ $value | humanizePercentage }} of responses were 5xx over the last 5 minutes."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeeperhigherrorratio"

      - alert: LorebaseKeeperMetricsMissing
        expr: absent(http_server_request_duration_seconds_count)
        for: 15m
        labels:
          severity: warning
          component: keeper
        annotations:
          summary: "No Keeper request metrics for 15 minutes"
          description: "Prometheus has no http.server.request.duration series: Keeper is down, has no traffic, or does not export (telemetry.otlp_endpoint)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasekeepermetricsmissing"

      - alert: LorebaseAuthFailuresThrottled
        expr: sum(rate(lorebase_http_rate_limited_total{class="auth_failures"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          component: keeper
        annotations:
          summary: "Keeper is refusing clients that keep failing to authenticate"
          description: "{{ $value | humanize }} requests per second are answered 429 because their address or API key prefix used up the failed authentication bucket."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebaseauthfailuresthrottled"

  - name: lorebase-store
    rules:
      - alert: LorebaseReplicaLagHigh
        expr: max by (replica) (lorebase_db_replica_lag_milliseconds) > 5000
        for: 10m
        labels:
          severity: warning
          component: store
        annotations:
          summary: "Replica {{ $labels.replica }} lags by more than 5 s"
          description: "Replay lag of {{ $labels.replica }} is {{ $value | humanize }} ms. Keeper sends reads to the primary above database.read_max_lag_ms (default 5000)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasereplicalaghigh"
      - alert: LorebaseReplicaDown
        expr: min by (replica) (lorebase_db_replica_up) == 0
        for: 5m
        labels:
          severity: warning
          component: store
        annotations:
          summary: "Replica {{ $labels.replica }} does not answer its probe"
          description: "Keeper cannot reach {{ $labels.replica }}; its reads go to the primary (or fail, when database.read_fallback_to_primary is false)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasereplicadown"

  - name: lorebase-scribe
    rules:
      - alert: LorebaseJobFailureRatio
        expr: |
          sum by (type) (increase(lorebase_scribe_jobs_total{status="failed"}[30m]))
            / sum by (type) (increase(lorebase_scribe_jobs_total[30m])) > 0.2
          and sum by (type) (increase(lorebase_scribe_jobs_total[30m])) >= 5
        for: 15m
        labels:
          severity: warning
          component: scribe
        annotations:
          summary: "More than 20% of {{ $labels.type }} jobs fail"
          description: "{{ $value | humanizePercentage }} of the {{ $labels.type }} jobs finished in the last 30 minutes ended failed (all attempts used)."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasejobfailureratio"

      # Claimable rows wait in the queue (reported by the scheduler leader) and no worker claims
      # any. Jobs waiting for a retry delay are reported as status="retrying" and do not count.
      - alert: LorebaseJobQueueStalled
        expr: |
          sum(lorebase_jobs_queue_depth{status="queued"}) > 0
          and (sum(increase(lorebase_jobs_claimed_total[15m])) or vector(0)) == 0
        for: 15m
        labels:
          severity: critical
          component: scribe
        annotations:
          summary: "Jobs are queued but no worker claims any"
          description: "{{ $value | humanize }} claimable jobs are queued and no worker claimed one in the last 15 minutes: workers are down, stuck or cannot reach the database."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasejobqueuestalled"

      # Running jobs lost their worker (killed, out of memory, cut off) and were taken back by
      # the scheduler leader. A clean stop releases its jobs instead, so this should stay at 0.
      - alert: LorebaseJobsReclaimed
        expr: sum by (type) (increase(lorebase_jobs_reclaimed_total[30m])) > 0
        labels:
          severity: warning
          component: scribe
        annotations:
          summary: "{{ $labels.type }} jobs were reclaimed from workers that stopped sending heartbeats"
          description: "{{ $value | humanize }} running {{ $labels.type }} jobs lost their worker in the last 30 minutes and were requeued (or failed, attempts used up). Workers are being killed or cannot reach the database."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasejobsreclaimed"

      # Dead deliveries: attempts used up, or a target refused (scheme, private address).
      - alert: LorebaseWebhookDeliveryFailing
        expr: sum(increase(lorebase_webhooks_deliveries_total{outcome="dead"}[1h])) > 0
        labels:
          severity: warning
          component: scribe
        annotations:
          summary: "Webhook deliveries are going dead"
          description: "{{ $value | humanize }} webhook deliveries became dead in the last hour (attempts used up or target refused). Check the dead deliveries in the database."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasewebhookdeliveryfailing"

      # Outbox events eligible for pruning left after the pass (the count is capped at 100000).
      - alert: LorebaseOutboxPruneBacklog
        expr: min_over_time(lorebase_outbox_prune_backlog[30m]) > 50000
        for: 30m
        labels:
          severity: warning
          component: scribe
        annotations:
          summary: "Outbox pruning cannot keep up"
          description: "{{ $value | humanize }} outbox events were still eligible for pruning after every pass of the last 30 minutes."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebaseoutboxprunebacklog"

      # N is 3 days: the default schedule collects every day at 03:00 UTC (scribe.scheduler.gc_schedule).
      # Only real collections count, and only a schedule that queues real ones (gc_dry_run false)
      # can raise it: a dry-run schedule or a null one does not page.
      - alert: LorebaseGcNotRun
        expr: |
          (sum(increase(lorebase_gc_runs_total{dry_run="false"}[3d])) or vector(0)) == 0
          and sum(increase(lorebase_gc_scheduled_total{dry_run="false"}[3d])) > 0
        for: 1h
        labels:
          severity: warning
          component: scribe
        annotations:
          summary: "No garbage collection has completed in 3 days"
          description: "The scheduler queued garbage collections but none completed in the last 3 days (dry runs excluded). Unreferenced objects, tree nodes and Revisions pile up."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasegcnotrun"

      # A background branch copy failed store.materialize.copy_max_failures times: the overlay
      # was detached from its base and is rebuilt from its tree. Its base no longer waits on it.
      - alert: LorebaseBranchCopyFallback
        expr: sum(increase(lorebase_store_branch_jobs_runs_total{job="materialize",outcome="fallback"}[6h])) > 0
        labels:
          severity: warning
          component: store
        annotations:
          summary: "A background branch copy kept failing and fell back to a tree build"
          description: "{{ $value | humanize }} overlay copies failed for good in the last 6 hours and were detached to be rebuilt from their trees. Commits into those branches wait until the build is done; check branch_materializations.error."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasebranchcopyfallback"

      # A tree build failed as often: the branch stays building and refuses commits.
      - alert: LorebaseBranchBuildFailed
        expr: sum(increase(lorebase_store_branch_jobs_runs_total{job="materialize",outcome="given_up"}[1h])) > 0
        labels:
          severity: critical
          component: store
        annotations:
          summary: "A branch build from its tree failed for good"
          description: "A store.materialize build used every retry; the branch stays building and refuses commits until the cause is fixed and the job is queued again."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebasebranchbuildfailed"

      # A scheduled audit_verify job found an entry that does not verify. The window spans the
      # default interval (scribe.scheduler.audit_verify_interval_s, one day), so the alert keeps
      # firing while the chain stays broken.
      - alert: LorebaseAuditChainBroken
        expr: sum(increase(lorebase_audit_verifications_total{outcome="broken"}[25h])) > 0
        labels:
          severity: critical
          component: scribe
        annotations:
          summary: "The audit log hash chain is broken"
          description: "An audit_verify job found an audit entry that does not verify: an entry was edited, removed or reordered. The job result names the first broken entry."
          runbook_url: "https://github.com/aantenore/lorebase/blob/main/docs/operations.md#lorebaseauditchainbroken"
