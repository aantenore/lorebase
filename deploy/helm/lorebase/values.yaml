# Default values of the Lorebase chart. Every key is documented here; docs/kubernetes.md has the
# install steps and three ready-made profiles (minimal, production, scale-out).
#
# What the chart installs, by default: Keeper (REST API) and the migration hook. Scribe, Herald,
# the web app, Ollama and the in-cluster Postgres are switched on one by one. Settings of the
# application itself live in `config` (the lorebase.yaml file, see config/lorebase.example.yaml);
# this file holds deployment settings only, the same split docker compose uses with .env.

# -- Naming ---------------------------------------------------------------------------------

# Replaces the chart name in resource names and in the app.kubernetes.io/name label.
nameOverride: ""
# Replaces the whole resource name prefix (default: <release>-<chart>, or <release> if it already contains the chart name).
fullnameOverride: ""
# Labels added to every resource and every pod.
commonLabels: {}
# Annotations added to every resource.
commonAnnotations: {}

# -- Image ----------------------------------------------------------------------------------

# One backend image for every Python service; the command selects Keeper, Scribe, Herald or the migration.
image:
  # Image repository (design 15.1).
  repository: ghcr.io/aantenore/lorebase
  # Image tag. Empty: the chart appVersion. Pin a version, or a digest with `@sha256:...` in `tag`, in production.
  tag: ""
  # Kubernetes image pull policy of the backend image.
  pullPolicy: IfNotPresent
# Pull secrets for private registries (list of {name: secret}). Used by every pod of the release.
imagePullSecrets: []

# -- Identity and security ---------------------------------------------------------------------

serviceAccount:
  # Create a ServiceAccount for the Keeper, Scribe, Herald, web and Ollama pods.
  create: true
  # Name of the ServiceAccount. Empty: the full release name when `create` is true, else `default`.
  name: ""
  # Annotations of the ServiceAccount (for example cloud workload identity bindings).
  annotations: {}
  # Mount the API token into pods. Lorebase never calls the Kubernetes API, so it stays off.
  automount: false

# Pod-level security context of the Lorebase pods (backend image uid/gid are 10001, see
# deploy/docker/backend.Dockerfile).
podSecurityContext:
  # Refuse to start a container that runs as root.
  runAsNonRoot: true
  # User id of the backend image.
  runAsUser: 10001
  # Group id of the backend image.
  runAsGroup: 10001
  # Group that owns mounted volumes.
  fsGroup: 10001
  # Default seccomp profile of the container runtime.
  seccompProfile:
    type: RuntimeDefault

# Container-level security context: no privilege escalation, no capabilities, read-only root
# file system (writable paths are emptyDir volumes: /tmp).
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Application settings (lorebase.yaml) -------------------------------------------------------

# Rendered as-is into the ConfigMap mounted at /etc/lorebase/lorebase.yaml and read through
# LOREBASE_CONFIG. Same keys and defaults as config/lorebase.example.yaml; every key is optional.
# Environment variables set by the chart override the file (precedence of the application):
# database.dsn and read_dsn, keeper.host and port, keeper.reads.prefer_replica, logging.level,
# telemetry.*, the API key pepper, webhooks.encryption_key and the LLM settings of Scribe. Do not
# repeat those here.
config:
  logging:
    # Structured logs for a log pipeline.
    format: json
  keeper:
    auth:
      # none | api_key | oidc | api_key+oidc. `none` accepts every request as an administrator:
      # development only, and Keeper refuses it on the pod address unless `allow_insecure: true`
      # is set next to it. api_key and api_key+oidc need `secrets.values.apiKeyPepper`
      # (or the pepper key of an existing Secret); the chart refuses to render without it.
      mode: api_key
      # Example OIDC block (issuer and audience are required with the oidc modes):
      # oidc:
      #   issuer: https://login.example.com/realms/lorebase
      #   audience: [lorebase]
      # installation_admins: [<principal id or identity provider subject>]
      #
      # Sign-in of the web app through Keeper (docs/deployment.md#web-sign-in). Needs an oidc mode,
      # the database and a client registered at the provider. The client secret and the encryption
      # key come from the Secret (`secrets.keys.oidcClientSecret`, `secrets.keys.sessionEncryptionKey`),
      # never from here; the chart wires them as secret://env references. Also set
      # `web.config.authMode: session`. Any other `sessions` setting of Keeper is accepted
      # (cookie_name, same_site, idle_timeout_s, absolute_timeout_s, login_timeout_s, scopes, ...).
      # sessions:
      #   enabled: true
      #   discovery_url: ""              # empty: <oidc.issuer>/.well-known/openid-configuration
      #   client_id: lorebase-web
      #   redirect_uri: https://lorebase.example.com/api/v1/auth/callback
      #   app_url: https://lorebase.example.com/
      #   cookie_secure: true
      #   idle_timeout_s: 3600
      #   absolute_timeout_s: 43200
      #   token_endpoint_auth_method: client_secret_basic   # none: public client, no client secret
  # Secret references a Source `connection` may name (docs/scribe.md). Empty, the default: Scribe
  # synchronizes no Source. Expose the referenced variables through `secrets.extra` or `extraNames`.
  # scribe:
  #   sources:
  #     allowed_connections: ["secret://env/ERP_DSN"]

# Log level of every service (LOREBASE__LOGGING__LEVEL). CRITICAL | ERROR | WARNING | INFO | DEBUG.
logLevel: INFO

# Telemetry (design 14). Empty endpoint disables export; there is no vendor exporter in the code.
telemetry:
  # OTLP/gRPC endpoint of a collector, for example http://otel-collector.observability:4317.
  otlpEndpoint: ""
  # Fraction of root traces sampled, 0 to 1.
  sampleRatio: 0.1

# -- Secrets ------------------------------------------------------------------------------------

# Values never appear in the ConfigMap: the application reads them through `secret://env/NAME`
# references or the documented environment aliases. Either let the chart create one Secret from
# `values`, or point `existingSecret` at a Secret you manage (sealed secrets, external-secrets,
# a vault injector). A key is wired into the pods only when its name below is non-empty and, for
# a chart-managed Secret, its value is set. With an existing Secret the read DSN and LLM key
# entries are optional (a missing key is ignored), and the pepper is wired when an API key mode is on.
secrets:
  # Name of an existing Secret in the release namespace. When set, the chart creates no Secret.
  existingSecret: ""
  # Key names inside the Secret (chart-managed or existing). An empty name disables the entry.
  keys:
    # Connection string of the application role Keeper and Scribe connect as, for example
    # postgresql+asyncpg://lorebase_app:pass@host:5432/lorebase (LOREBASE_DB_DSN). Its user must be
    # `database.appRole.name`; it is neither superuser nor owner of the tables (docs/deployment.md#database-roles).
    dbDsn: db-dsn
    # Connection string of the maintenance role, the owner of the tables (LOREBASE_DB_MAINTENANCE_DSN): the
    # migration Job and its role setup, per-Attribute index DDL run by Scribe, the installation commands.
    # Must name another user than dbDsn. Not used with `postgresql.enabled` (the operator's owner Secret).
    dbMaintenanceDsn: db-maintenance-dsn
    # Read replica connection strings, comma separated (LOREBASE_DB_READ_DSN). Empty: all reads on the primary.
    dbReadDsn: db-read-dsn
    # Pepper of the API key hashes, at least 32 characters (secret://env/LOREBASE_API_KEY_PEPPER). Changing it invalidates every key.
    apiKeyPepper: api-key-pepper
    # API key of the LLM endpoint used by Scribe (LLM_API_KEY). Not needed for Ollama.
    llmApiKey: llm-api-key
    # OIDC client secret of the web sign-in (secret://env/LOREBASE_OIDC_CLIENT_SECRET). Wired only when
    # `config.keeper.auth.sessions.enabled`; empty name for a public client (token_endpoint_auth_method: none).
    oidcClientSecret: oidc-client-secret
    # Key (32 characters or more, for example `openssl rand -base64 48`) that encrypts the sign-in cookie and the
    # provider tokens held with a session. Wired only when sessions are enabled.
    sessionEncryptionKey: session-encryption-key
    # Key (32 characters or more, for example `openssl rand -hex 32`) that seals the webhook signing keys
    # stored in the database (secret://env/LOREBASE_WEBHOOK_KEY, webhooks.encryption_key), shared by Keeper
    # and Scribe. Required: the chart refuses to render without it unless `config.webhooks.encryption_key`
    # is set or `config.webhooks.allow_unsealed_keys: true` (local development only). Keep it: signing keys
    # sealed under a lost key cannot be opened; rotate through webhooks.previous_encryption_keys.
    webhookEncryptionKey: webhook-encryption-key
  # Values for the chart-managed Secret. Ignored when `existingSecret` is set. Prefer
  # `--set-file` or a values file kept out of git; never commit real values.
  values:
    # Application role DSN. Ignored when `postgresql.enabled` (built from `dbAppPassword`).
    dbDsn: ""
    # Maintenance (owner) role DSN. Ignored when `postgresql.enabled` (the cluster's owner Secret).
    dbMaintenanceDsn: ""
    # With `postgresql.enabled`: password of the application role, URL-safe characters only, 16 or more
    # (for example `openssl rand -hex 24`). The chart stores it in the kubernetes.io/basic-auth Secret
    # `database.appRole.passwordSecret`, which the operator reads (`postgresql.cluster.roles`).
    dbAppPassword: ""
    # Read replica DSNs: a string, or a list that the chart joins with commas.
    dbReadDsn: ""
    # Pepper for API key hashes, 32 characters or more.
    apiKeyPepper: ""
    # LLM API key for hosted endpoints.
    llmApiKey: ""
    # Client secret registered at the identity provider for the web sign-in.
    oidcClientSecret: ""
    # Session encryption key, 32 characters or more.
    sessionEncryptionKey: ""
    # Key that seals the webhook signing keys, 32 characters or more.
    webhookEncryptionKey: ""
  # Any further secret as ENV_NAME: value in the chart-managed Secret. Reference it from `config`
  # as secret://env/ENV_NAME (for example OIDC or hosted-embedding credentials). Exposed to Keeper and Scribe.
  extra: {}
  # With `existingSecret`: names of keys in that Secret to expose as environment variables of the
  # same name to Keeper and Scribe, for use in `secret://env/NAME` references.
  extraNames: []

# -- Database ---------------------------------------------------------------------------------

# Database roles (docs/deployment.md#database-roles), as on compose: the maintenance role owns the
# tables and runs the migrations and the index DDL; Keeper and Scribe connect as the application
# role, without SUPERUSER, BYPASSRLS or ownership, so row-level security and the append-only audit
# log apply to them. The migration Job sets the application role up first (init container
# `db-roles`, files/db-roles.py): creates it if asked, then grants row rights, revokes CREATE on
# `public` and UPDATE/DELETE on audit_log. Idempotent; it runs before every migration.
database:
  appRole:
    # Name of the application role; the user of `secrets.keys.dbDsn`. Lower case letters, digits, `_`.
    name: lorebase_app
    # External database: create the role when missing and set its password from the application DSN
    # (the maintenance role needs CREATEROLE). false: the role exists (created by an administrator);
    # the Job waits for it and grants. Ignored with `postgresql.enabled` (the operator creates it).
    create: true
    # With `postgresql.enabled`: the kubernetes.io/basic-auth Secret (keys username, password) of the
    # role. Must match `passwordSecret.name` of the role in `postgresql.cluster.roles`. Created by the
    # chart from `secrets.values.dbAppPassword`, or by you with `secrets.existingSecret`.
    passwordSecret: lorebase-db-app
  setup:
    # Run the `db-roles` init container of the migration Job (needs `migrate.enabled`). false: you keep
    # the role and its grants yourself (deploy/compose/postgres/app-role.sh lists them).
    enabled: true
    # How long the Job waits for a role it does not create (operator or administrator), in seconds.
    waitSeconds: 300
    # In-cluster database (`postgresql.enabled`): the operator creates the roles of
    # `postgresql.cluster.roles` only once Helm applies the Cluster, after the pre-upgrade hooks. With
    # this on, a `pg-roles` hook Job runs before the migration Job of every upgrade: it adds the roles
    # to the Cluster and waits (`waitSeconds`) until the operator created the application role, so one
    # `helm upgrade` adds a role (a password Secret created by the same upgrade is applied by the
    # operator right after the hooks). Idempotent.
    # Needs pre-upgrade in `migrate.hookEventsInCluster` and, with egress restricted, access to the
    # Kubernetes API (`networkPolicy.egress.kubernetesApi`).
    clusterRoles:
      enabled: true
  # Keeper gets the maintenance DSN too, as on compose: with it, schema commits queue their
  # per-Attribute index changes for Scribe, and the installation commands (`bootstrap`, `principal
  # create`) run in the pod. Keeper never connects with it while serving. false keeps the owner
  # credentials out of Keeper; schema commits then skip index management with a warning
  # (`python -m lorebase_store.indexes plan`). Scribe always gets it (it runs the index DDL).
  maintenanceDsnInKeeper: true
  # Development only. true: every component, Keeper and Scribe included, connects with the one DSN of
  # `secrets.keys.dbDsn` (or the operator's owner Secret), no role setup runs, and the services own the
  # tables (row-level security relies on FORCE alone, the audit log stays writable, DDL is possible).
  # false (default): the chart refuses one role for both and wires the two DSNs above.
  allowSharedRole: false

# Postgres 16 with the pgvector extension is required. Production: an external managed or
# operator-run Postgres, passed as a DSN through `secrets`. Optional in-cluster Postgres: the
# CloudNativePG `cluster` chart as a subchart under this key (requires the CloudNativePG operator
# in the cluster and `helm dependency build`). The chart reads the connection string from the
# `<cluster>-app` Secret the operator creates. Keys other than `enabled` below are passed to the subchart.
postgresql:
  # Deploy a CloudNativePG Cluster with the release. Off by default.
  enabled: false
  # Name of the Cluster and its Services (<name>-rw, <name>-ro). Empty: <release>-postgresql.
  fullnameOverride: ""
  # Postgres major version; the image below must ship it.
  version:
    postgresql: "16"
  cluster:
    # Postgres instances (1 primary + standbys).
    instances: 1
    # REQUIRED when enabled: a CloudNativePG-compatible image that includes pgvector. The default
    # CloudNativePG image does not ship it; the chart refuses to render with this empty.
    imageName: ""
    storage:
      # Size of the data volume of each instance.
      size: 20Gi
      # Storage class; empty: the cluster default.
      storageClass: ""
    initdb:
      # Application database and owner created at bootstrap.
      database: lorebase
      owner: lorebase
      # Run as superuser in the new database, once.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
    # Roles the operator manages: the application role of Keeper and Scribe (`database.appRole`). Its
    # password comes from the basic-auth Secret `database.appRole.passwordSecret`; grants are applied
    # by the migration Job. Keep name and passwordSecret in line with `database.appRole`.
    roles:
      - name: lorebase_app
        ensure: present
        comment: Lorebase application role (Keeper, Scribe), subject to row-level security
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        replication: false
        inherit: true
        passwordSecret:
          name: lorebase-db-app
    postgresql:
      # postgresql.conf parameters (string values). Size max_connections above
      # Keepers x (pool_size + max_overflow), plus Scribe, migrations and admin.
      parameters:
        max_connections: "100"

# -- Migrations ---------------------------------------------------------------------------------

# `alembic upgrade head` as a Helm hook Job (design 15.3). Forward-only and online-safe
# migrations; the Job finishes before the new Keeper pods roll out.
migrate:
  # Run the Job. Turn off only to run migrations yourself.
  enabled: true
  # Helm hook events. With the in-cluster Postgres the database does not exist before the first
  # install, so the chart uses `post-install` instead of `pre-install` (do not combine with --wait).
  hookEvents: [pre-install, pre-upgrade]
  # Hook events used instead when `postgresql.enabled`.
  hookEventsInCluster: [post-install, pre-upgrade]
  # Order among hooks; the hook ConfigMap and Secret run at -5 so they exist before the Job.
  hookWeight: 0
  # Command; alembic.ini sits in the working directory.
  command: ["alembic", "upgrade", "head"]
  # Where alembic.ini and the migration scripts are in the image.
  workingDir: /opt/lorebase/store
  # Retries of a failed Job pod.
  backoffLimit: 3
  # Hard limit on the whole Job, in seconds. Long migrations on big tables need more.
  activeDeadlineSeconds: 1800
  # Wait until the database port accepts connections before running alembic.
  waitForDatabase:
    enabled: true
    # Give up after this many seconds (the Job then fails and Helm reports it).
    timeoutSeconds: 180
    # Pause between attempts.
    intervalSeconds: 3
  # ServiceAccount of the Job. Empty: the namespace default. The chart ServiceAccount does not
  # exist yet during pre-install hooks.
  serviceAccountName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional environment variables of the Job (list of Kubernetes EnvVar).
  extraEnv: []

# -- Keeper (REST API) --------------------------------------------------------------------------

keeper:
  # Command of the backend image.
  command: ["python", "-m", "lorebase_keeper"]
  # Replicas when the HPA is off. Stateless: any number works behind the Service (docs/deployment.md).
  replicaCount: 2
  # Container port and keeper.port.
  port: 8080
  # Route read endpoints to the read replicas when one is fresh enough (keeper.reads.prefer_replica).
  # Needs `secrets.values.dbReadDsn`.
  preferReplica: false
  # Rate limit buckets (keeper.limits.rate.backend): local (per pod) or postgres (shared by every
  # pod, in the application database). Empty: postgres when replicaCount > 1 or the HPA is on,
  # unless config.keeper.limits.rate.backend is set; otherwise the configuration's (local).
  rateLimitBackend: ""
  # Rolling update: add a pod first, never go below the desired count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Annotations and labels added to the pods.
  podAnnotations: {}
  podLabels: {}
  # CPU and memory. The memory limit leaves room for the node cache (store.nodes.cache_bytes,
  # 64 MiB) and the read cache (32 MiB). No CPU limit: throttling hurts latency.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Probes use the real endpoints: /healthz never touches dependencies; /readyz checks the
  # database, the migration revision and the replicas (503 when not ready).
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 3
    failureThreshold: 30
    timeoutSeconds: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  # Seconds the pod gets to finish in-flight requests after SIGTERM.
  terminationGracePeriodSeconds: 30
  # Seconds to keep serving after the pod leaves the Service endpoints, so no request is cut off.
  preStopSleepSeconds: 5
  # Spread the replicas over zones and nodes. The labelSelector of the release is added when omitted.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # Additional environment variables, volumes and mounts (Kubernetes EnvVar, Volume, VolumeMount).
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    # ClusterIP behind the Ingress; LoadBalancer for direct exposure.
    type: ClusterIP
    # Service port.
    port: 8080
    annotations: {}
  autoscaling:
    # HorizontalPodAutoscaler (autoscaling/v2). Needs metrics-server. When on, `replicaCount` is ignored.
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    # Average CPU utilisation of the requests, in percent. null disables the metric.
    targetCPUUtilizationPercentage: 70
    # Average memory utilisation, in percent. null disables the metric.
    targetMemoryUtilizationPercentage: null
    # Placeholder for a custom metric (Prometheus Adapter, KEDA metrics API...). Full v2 metric
    # specs, appended to the CPU entry. Example, p95 request rate per pod:
    #   - type: Pods
    #     pods:
    #       metric:
    #         name: lorebase_http_requests_per_second
    #       target:
    #         type: AverageValue
    #         averageValue: "50"
    customMetrics: []
    # HPA scaling behavior (stabilization windows, policies); omitted when empty.
    behavior: {}
  pdb:
    # PodDisruptionBudget so that node drains keep Keeper available.
    enabled: true
    # Pods that must stay up. Set one of the two; null skips the field.
    minAvailable: null
    # Pods that may be unavailable at once.
    maxUnavailable: 1

# -- Scribe (job worker and scheduler, docs/scribe.md) ----------------------------------------

scribe:
  # Off by default: without it, queued jobs (Source syncs, index builds) are not processed. When
  # on, the workers pull jobs with SELECT ... FOR UPDATE SKIP LOCKED and elect their leader inside
  # the application, so any replica count is safe.
  enabled: false
  command: ["lorebase-scribe"]
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podLabels: {}
  # Model and CPU bound, not database bound (docs/deployment.md).
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # Scribe has no HTTP port; add probes here (for example an exec probe) once it ships a health command.
  startupProbe: {}
  livenessProbe: {}
  readinessProbe: {}
  terminationGracePeriodSeconds: 60
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  autoscaling:
    # Scale on queue depth through a custom or external metric (KEDA, Prometheus Adapter).
    enabled: false
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null
    # Placeholder, same format as keeper.autoscaling.customMetrics. Example (external metric):
    #   - type: External
    #     external:
    #       metric:
    #         name: lorebase_jobs_queue_depth
    #       target:
    #         type: AverageValue
    #         averageValue: "20"
    customMetrics: []
    behavior: {}
  pdb:
    enabled: false
    minAvailable: null
    maxUnavailable: 1

# -- Herald (MCP server, streamable HTTP) -----------------------------------------------------

herald:
  # Serve the Model Context Protocol over streamable HTTP for agents. Each caller's own API key
  # is forwarded to Keeper, so Herald holds no credential.
  enabled: false
  command: ["python", "-m", "lorebase_herald"]
  replicaCount: 2
  # Container port (herald.http.port).
  port: 8090
  # Endpoint path (herald.http.path).
  path: /mcp
  # Origin of Keeper as seen from Herald (herald.keeper.base_url). Empty: the in-cluster Keeper Service.
  keeperUrl: ""
  # Domain and branch used when a call names none (herald.domain, herald.branch). Empty: not set.
  domain: ""
  branch: ""
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Herald serves only the MCP endpoint (no health route), so the probes check the TCP port.
  startupProbe:
    tcpSocket:
      port: http
    periodSeconds: 3
    failureThreshold: 20
  livenessProbe:
    tcpSocket:
      port: http
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: http
    periodSeconds: 10
    failureThreshold: 3
  terminationGracePeriodSeconds: 30
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    type: ClusterIP
    port: 8090
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    customMetrics: []
    behavior: {}
  pdb:
    enabled: true
    minAvailable: null
    maxUnavailable: 1

# -- Guide (exploration assistant) -------------------------------------------------------------

guide:
  # Optional assistant for exploring Domains: embeddings and streamed answers over Keeper reads.
  # Each caller's own Authorization or session cookie is forwarded to Keeper, so Guide holds no
  # Keeper credential. It calls the model endpoint of `config.inference` (LLM_API_KEY from
  # `secrets.values.llmApiKey`; with `ollama.enabled` and `ollama.wireScribe`, the in-cluster Ollama).
  # The default fastembed embeddings need an image built with UV_SYNC_ARGS="--extra fastembed";
  # otherwise set config.inference.embeddings.provider to openai_compatible.
  enabled: false
  command: ["lorebase-guide"]
  replicaCount: 1
  # Container port (guide.port).
  port: 8095
  # Origin of Keeper as seen from Guide (guide.keeper.base_url). Empty: the in-cluster Keeper Service.
  keeperUrl: ""
  # Browser origins allowed to call Guide (guide.http.allowed_origins), e.g. ["https://lorebase.example.com"].
  # Reach Guide through its own host or an Ingress path that strips its prefix: it serves /embed and /explore.
  allowedOrigins: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 3
    failureThreshold: 40
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 15
    failureThreshold: 3
  # Ready while Keeper is reachable.
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 10
    failureThreshold: 3
  terminationGracePeriodSeconds: 30
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    type: ClusterIP
    port: 8095
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    customMetrics: []
    behavior: {}
  pdb:
    enabled: false
    minAvailable: null
    maxUnavailable: 1

# -- Web app (nginx serving the built static files) -------------------------------------------

web:
  # Deploy the web app. The image is an unprivileged nginx with the production build in
  # /usr/share/nginx/html (design 15.1).
  enabled: false
  image:
    repository: ghcr.io/aantenore/lorebase-web
    # Empty: the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Container port of the unprivileged nginx.
  port: 8080
  # Runtime configuration, served as /config.js (window.__LOREBASE_CONFIG__) so that one image
  # works against any Keeper. The keys are the names of the Vite variables of apps/web.
  config:
    # `live` talks to Keeper over REST; `mock` serves sample Domains from memory.
    apiMode: live
    # `token`: bearer token in the browser (VITE_API_TOKEN through `extra`). `session`: sign in through
    # Keeper with a cookie session (VITE_AUTH_MODE); needs `config.keeper.auth.sessions.enabled` and the
    # app and Keeper on one origin (Ingress paths).
    authMode: token
    # Origin of Keeper as the browser sees it, without /api/v1. Empty with an enabled Ingress:
    # https:// plus the first host of `ingress.hosts` (http:// without `ingress.tls`).
    keeperBaseUrl: ""
    # Origin of Guide as the browser sees it (VITE_GUIDE_URL), for the exploration assistant of the
    # web app; added to connect-src. Empty: not set, the assistant is off in the app. Guide must
    # list the app origin in `guide.allowedOrigins`.
    guideUrl: ""
    # Further VITE_* values (for example VITE_PAGE_SIZE: "50"), written to config.js unchanged.
    extra: {}
  # Security headers of the web app. Always sent: X-Content-Type-Options, X-Frame-Options DENY and
  # Referrer-Policy no-referrer.
  security:
    # Content-Security-Policy. Empty: the default policy, which allows scripts, styles, images and
    # fonts from the app itself, blob: workers (the Canvas layout) and connections to the app and to
    # Keeper (the origin of `config.keeperBaseUrl`, live mode).
    csp: ""
    # Further connect-src sources of the default policy, e.g. ["https://api.example.com"].
    connectSrc: []
    # Strict-Transport-Security value, e.g. "max-age=31536000". Empty: not sent (TLS is usually
    # terminated at the Ingress, which can add it).
    hsts: ""
  # Cache-Control of the hashed assets under /assets/.
  assetsCacheControl: "public, max-age=31536000, immutable"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podLabels: {}
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 3
    failureThreshold: 20
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    failureThreshold: 3
  terminationGracePeriodSeconds: 30
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    customMetrics: []
    behavior: {}
  pdb:
    enabled: true
    minAvailable: null
    maxUnavailable: 1

# -- Ollama (local models profile) ------------------------------------------------------------

ollama:
  # Run Ollama in the cluster and point Scribe at it (the Kubernetes counterpart of the
  # compose profile `local-models`). Needs `scribe.enabled`.
  enabled: false
  image:
    repository: ollama/ollama
    # Pin a version in production; compose follows `latest` as well.
    tag: latest
    pullPolicy: IfNotPresent
  # Model pulled when the pod starts; also LLM_MODEL of Scribe.
  model: qwen2.5:7b-instruct
  # Set LLM_BASE_URL and LLM_MODEL on Scribe from the two values above. Turn off to configure
  # inference only through `config.inference`.
  wireScribe: true
  # Container and Service port.
  port: 11434
  persistence:
    # Keep the models on a PersistentVolumeClaim; off uses an emptyDir (models are pulled again after a restart).
    enabled: true
    # Use an existing claim instead of creating one.
    existingClaim: ""
    size: 30Gi
    # Storage class; empty: the cluster default.
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
  # One pod: a PVC with ReadWriteOnce cannot be shared, so the Deployment recreates the pod on updates.
  # GPU: add `nvidia.com/gpu: 1` under resources.limits and a matching nodeSelector or toleration.
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      memory: 16Gi
  # Ollama image runs as root by default; the chart runs it as this user with HOME on the volume.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10002
    runAsGroup: 10002
    fsGroup: 10002
    seccompProfile:
      type: RuntimeDefault
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  service:
    annotations: {}

# -- Ingress -----------------------------------------------------------------------------------

ingress:
  # Create an Ingress for Keeper (and Herald and the web app when enabled).
  enabled: false
  # IngressClass name, for example nginx. Empty: the cluster default class.
  className: ""
  # Annotations of the controller. Example for ingress-nginx and cert-manager:
  #   nginx.ingress.kubernetes.io/proxy-body-size: 2m   # above keeper.limits.max_request_body_bytes
  #   cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}
  # Hosts and the path of each component. A path whose component is not enabled is skipped.
  # Keep the Keeper path equal to keeper.api_prefix of `config` (default /api/v1) without the version.
  hosts:
    - host: lorebase.example.com
      paths:
        - path: /api
          pathType: Prefix
          component: keeper
        - path: /mcp
          pathType: Prefix
          component: herald
        - path: /
          pathType: Prefix
          component: web
  # TLS: list of {secretName, hosts}. Leave the secretName empty to let the controller default apply.
  tls: []
  #  - secretName: lorebase-tls
  #    hosts: [lorebase.example.com]

# -- Network policy ----------------------------------------------------------------------------

# On by default; it needs a CNI that enforces NetworkPolicy (without one the objects have no effect).
# Ingress to every pod of the release is closed except Keeper, Herald and the web app (below) and
# Ollama (from Scribe). With `egress.enabled` each workload may open only the connections it needs.
networkPolicy:
  enabled: true
  # Who may reach the exposed pods (Keeper, Herald, web) besides the pods of this release:
  # a list of NetworkPolicyPeer. Default: the namespace of the ingress controller.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    # Restrict egress per workload. Allowed then, and nothing else:
    #   Keeper: DNS, Postgres, the OTLP collector, `extra.keeper`
    #   Scribe: DNS, Postgres, the OTLP collector, the model endpoint, webhook receivers, `extra.scribe`
    #   Guide: DNS, Keeper, the model endpoint, `extra.guide`
    #   Herald: DNS, Keeper, `extra.herald`; web app: `extra.web` only (static files)
    #   Ollama: DNS, `extra.ollama`; migration Job: DNS, Postgres; `helm test` pod: DNS, Keeper
    #   `pg-roles` hook Job (in-cluster database, upgrades): `kubernetesApi` only
    enabled: true
    # Namespace and pods of the cluster DNS (CoreDNS and kube-dns both carry k8s-app: kube-dns).
    # NodeLocal DNSCache answers on a link-local address: add it to `rules` as an ipBlock.
    dnsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    # null: every pod of the namespace above.
    dnsPodSelector:
      matchLabels:
        k8s-app: kube-dns
    dnsPorts:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    # Postgres, from Keeper, Scribe and the migration Job.
    database:
      # Peers of an external Postgres (list of NetworkPolicyPeer): the ipBlock of its address
      # range, or pod and namespace selectors. Ignored with `postgresql.enabled`: the pods of the
      # in-cluster Cluster are used. Default: the private IPv4 ranges; narrow it to the database.
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 5432
    # OTLP collector, from Keeper and Scribe, when `telemetry.otlpEndpoint` is set. Default: the
    # private IPv4 ranges; narrow it, for example to the collector namespace. Empty: no rule.
    telemetry:
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Model endpoint of Scribe. With `ollama.enabled` the Ollama pods are allowed on `ollama.port`
    # without configuration. A hosted endpoint needs its address range here. Empty: none.
    model:
      to: []
      ports:
        - protocol: TCP
          port: 443
    # Kubernetes API server, from the `pg-roles` hook Job of an upgrade (in-cluster database,
    # `database.setup.clusterRoles`). Most CNIs match the API server endpoints after the Service
    # address is translated: the control plane addresses, port 6443 (443 on some managed clusters).
    # Default: the private IPv4 ranges; narrow it to the control plane.
    kubernetesApi:
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Webhook receivers, from Scribe (webhook_delivery jobs). Targets are public addresses
    # (webhooks.allow_private_targets is false by default), so list their ranges. Empty: none.
    webhooks:
      to: []
      ports:
        - protocol: TCP
          port: 443
    # Further egress rules per workload (lists of NetworkPolicyEgressRule). Examples: the OIDC
    # issuer (JWKS over HTTPS) and hosted embeddings for keeper, Source databases for scribe, a
    # Keeper outside the cluster for herald, the model registry of the Ollama pull for ollama.
    extra:
      keeper: []
      scribe: []
      herald: []
      guide: []
      web: []
      ollama: []
      migrate: []
    # Rules added to every pod of the release (list of NetworkPolicyEgressRule). Example:
    #   - to: [{ipBlock: {cidr: 169.254.20.10/32}}]
    #     ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    rules: []

# -- Monitoring --------------------------------------------------------------------------------

serviceMonitor:
  # Create a Prometheus Operator ServiceMonitor. The services export OTLP (telemetry.otlpEndpoint)
  # and do not serve /metrics themselves, so this scrapes the Prometheus exporter of your
  # OpenTelemetry Collector (deploy/observability/otel-collector.yaml, port 8889). Needs the
  # monitoring.coreos.com CRDs.
  enabled: false
  # Namespace of the ServiceMonitor. Empty: the release namespace.
  namespace: ""
  # Labels so that your Prometheus selects it (for example release: kube-prometheus-stack).
  labels: {}
  # REQUIRED when enabled: labels of the collector Service to scrape.
  selector:
    matchLabels: {}
  # Namespaces searched for that Service. Empty: the release namespace.
  namespaceSelector:
    matchNames: []
  # Name of the collector Service port that serves the metrics.
  port: prometheus
  # Metrics path.
  path: /metrics
  # Scrape interval and timeout.
  interval: 30s
  scrapeTimeout: 10s

observability:
  # Create ConfigMaps from deploy/observability (docs/metrics.md, docs/operations.md "Dashboards
  # and alerts"). They only carry files: mount them into your Grafana, Prometheus and collector.
  enabled: false
  dashboards:
    # The Grafana dashboards (Keeper, Store, Scribe), as one ConfigMap for the Grafana sidecar.
    enabled: true
    # Namespace of the ConfigMap. Empty: the release namespace. Use the sidecar's namespace if it
    # does not watch all of them.
    namespace: ""
    # Label the sidecar selects ConfigMaps by (grafana's `sidecar.dashboards.label`).
    labels:
      grafana_dashboard: "1"
  alertRules:
    # The Prometheus alert rules file. Mount it where Prometheus reads `rule_files`, or load it
    # with your Prometheus Operator tooling.
    enabled: true
    namespace: ""
    labels: {}
  collector:
    # The OpenTelemetry Collector configuration (OTLP in, Prometheus metrics on :8889, traces to
    # an OTLP backend; set LOREBASE_TRACES_OTLP_ENDPOINT on the collector for Jaeger or Tempo).
    enabled: true
    namespace: ""

# -- Tests -------------------------------------------------------------------------------------

tests:
  # `helm test` calls /readyz on the Keeper Service with the backend image.
  enabled: true
