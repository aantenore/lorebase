# Production profile: secrets come from a Secret you manage, pinned image, Ingress with TLS,
# network policy with narrow egress, Herald and the web app, telemetry to a collector. The
# address ranges below are placeholders (192.0.2.0/24 is a documentation range): replace them.
image:
  tag: "0.3.0"
secrets:
  existingSecret: lorebase-secrets
  keys:
    dbDsn: db-dsn
    dbMaintenanceDsn: db-maintenance-dsn
    dbReadDsn: ""
    apiKeyPepper: api-key-pepper
    webhookEncryptionKey: webhook-encryption-key
    llmApiKey: ""
logLevel: INFO
telemetry:
  otlpEndpoint: http://otel-collector.observability.svc:4317
  sampleRatio: 0.05
config:
  logging:
    format: json
  keeper:
    auth:
      mode: api_key+oidc
      oidc:
        issuer: https://login.example.com/realms/lorebase
        audience: [lorebase]
    openapi:
      # Do not serve /api/v1/docs and /api/v1/openapi.json in production.
      docs_enabled: false
keeper:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
herald:
  enabled: true
web:
  enabled: true
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: lorebase.example.com
      paths:
        - {path: /api, pathType: Prefix, component: keeper}
        - {path: /mcp, pathType: Prefix, component: herald}
        - {path: /, pathType: Prefix, component: web}
  tls:
    - secretName: lorebase-tls
      hosts: [lorebase.example.com]
networkPolicy:
  enabled: true
  egress:
    enabled: true
    # The external Postgres.
    database:
      to: [{ipBlock: {cidr: 10.0.0.0/16}}]
    # The OpenTelemetry Collector (OTLP/gRPC).
    telemetry:
      to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 4317}]
    extra:
      # The OIDC issuer, for its discovery document and keys.
      keeper:
        - to: [{ipBlock: {cidr: 192.0.2.0/24}}]
          ports: [{protocol: TCP, port: 443}]
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  namespaceSelector:
    matchNames: [observability]
