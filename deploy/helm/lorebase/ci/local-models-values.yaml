# Local models profile: Ollama in the cluster and Scribe pointed at it, with the in-cluster
# Postgres (CloudNativePG operator required). Placeholders only; see docs/kubernetes.md.
secrets:
  values:
    apiKeyPepper: change-me-change-me-change-me-change-me
    webhookEncryptionKey: change-me-change-me-change-me-webhook
    # Password of the application role the operator creates (postgresql.cluster.roles).
    dbAppPassword: change-me-change-me-app
postgresql:
  enabled: true
  cluster:
    instances: 1
    imageName: registry.example.com/postgres-pgvector:16
scribe:
  enabled: true
ollama:
  enabled: true
  model: qwen2.5:7b-instruct
  persistence:
    size: 30Gi
networkPolicy:
  egress:
    extra:
      # The registry Ollama pulls the model from (placeholder documentation range: replace it,
      # or put the model on the volume beforehand and drop this rule).
      ollama:
        - to: [{ipBlock: {cidr: 203.0.113.0/24}}]
          ports: [{protocol: TCP, port: 443}]
