{{- if include "lorebase.managedSecret" . }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lorebase.secretName" . }}
  labels:
    {{- include "lorebase.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
  {{- include "lorebase.commonAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- if and $s.keys.dbDsn (not .Values.postgresql.enabled) (get $s.values "dbDsn") }}
  {{ $s.keys.dbDsn }}: {{ get $s.values "dbDsn" | quote }}
  {{- end }}
  {{- if and $s.keys.dbMaintenanceDsn (not .Values.postgresql.enabled) (include "lorebase.splitRoles" .) (get $s.values "dbMaintenanceDsn") }}
  {{ $s.keys.dbMaintenanceDsn }}: {{ get $s.values "dbMaintenanceDsn" | quote }}
  {{- end }}
  {{- if and $s.keys.dbReadDsn (get $s.values "dbReadDsn") }}
  {{- $read := get $s.values "dbReadDsn" }}
  {{ $s.keys.dbReadDsn }}: {{ ternary (join "," $read) $read (kindIs "slice" $read) | quote }}
  {{- end }}
  {{- if and $s.keys.apiKeyPepper (get $s.values "apiKeyPepper") }}
  {{ $s.keys.apiKeyPepper }}: {{ get $s.values "apiKeyPepper" | quote }}
  {{- end }}
  {{- if and $s.keys.llmApiKey (get $s.values "llmApiKey") }}
  {{ $s.keys.llmApiKey }}: {{ get $s.values "llmApiKey" | quote }}
  {{- end }}
  {{- if and $s.keys.oidcClientSecret (get $s.values "oidcClientSecret") }}
  {{ $s.keys.oidcClientSecret }}: {{ get $s.values "oidcClientSecret" | quote }}
  {{- end }}
  {{- if and $s.keys.sessionEncryptionKey (get $s.values "sessionEncryptionKey") }}
  {{ $s.keys.sessionEncryptionKey }}: {{ get $s.values "sessionEncryptionKey" | quote }}
  {{- end }}
  {{- range $name, $value := $s.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if include "lorebase.appRoleSecret" . }}
---
# Password of the application role; the CloudNativePG operator sets it on the managed role.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.appRole.passwordSecret }}
  labels:
    {{- include "lorebase.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
    cnpg.io/reload: "true"
  {{- include "lorebase.commonAnnotations" . | nindent 2 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.appRole.name | quote }}
  password: {{ get .Values.secrets.values "dbAppPassword" | quote }}
{{- end }}
