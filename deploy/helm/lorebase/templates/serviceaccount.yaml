{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lorebase.serviceAccountName" . }}
  labels:
    {{- include "lorebase.labels" (dict "ctx" . "component" "serviceaccount") | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- toYaml (merge (deepCopy .Values.serviceAccount.annotations) (deepCopy .Values.commonAnnotations)) | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
