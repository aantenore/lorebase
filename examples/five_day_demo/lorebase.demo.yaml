# Settings of the five-day demo stack (examples/five_day_demo). Everything not listed here keeps
# the default of config/lorebase.example.yaml. Not for production: it admits webhook targets on
# private addresses, keeps the demo pace (short polling intervals) and runs every model task on
# the deterministic fake provider, so the demo needs no model server and no network.

keeper:
  auth:
    mode: api_key                      # stack.sh: python -m lorebase_keeper bootstrap
    installation_admins: [svc_demo_admin]
    api_keys:
      pepper: secret://env/LOREBASE_API_KEY_PEPPER
  proposals:
    allow_self_approval: true          # one operator plays every team
  limits:
    rate:
      domains:
        supply:                        # a deliberately small bucket: day 5 shows a 429
          context: {requests_per_minute: 30, burst: 4}

webhooks:
  allowed_schemes: [http, https]
  allow_private_targets: true          # the receiver of day 4 runs on the host

scribe:
  worker:
    poll_interval_s: 0.5
  scheduler:
    tick_s: 2.0
    webhook_interval_s: 2.0
    gc_schedule: null                  # the demo runs the collection by hand
  extraction:
    tiers: [0, 1]                      # rules and the fake span extractor; never tier 2

inference:
  llm: {provider: fake}
  embeddings: {provider: fake}
  local_extractors: {provider: fake}   # tier 1 of extraction; tier 0 (rules) does the work
