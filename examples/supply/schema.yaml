# Domain `supply`: suppliers, parts, plants, purchase orders and supplier contracts of
# Corvane Industries, a fictional distributor of industrial components. See README.md.
#
# Elements are keyed by api name and refer to each other by api name. The `id` of each
# element is its stable identity: rename the key freely, never change the id.
format: lorebase.schema/v1

domain:
  id: supply
  display_name: Supply chain
  description: Suppliers, parts, plants, purchase orders and supplier contracts.
  default_branch: main
  settings:
    search_language: english
  examples:
    - label: Single-source risk
      question: Which parts depend on a single supplier, and how risky is that supplier?
    - label: Tier-1 high risk with open orders
      question: Which tier-1 suppliers have a high risk score and open purchase orders?
    - label: What if S-1007 stops
      question: What is the impact if supplier S-1007 stops delivering?
    - label: History of C-3013
      question: What is the history of contract C-3013?
    - label: Typo search "bering"
      question: Who supplies bering parts?

kinds:
  Supplier:
    id: knd_01KEZF7C007ZDX8SK1DZP7MXFF
    description: A company that supplies parts to Corvane Industries.
    primary_key: [supplier_code]
    title_attribute: legal_name
    icon: factory
    color: "#2a6f97"
    search:
      embedding_template: "{legal_name}, {city} ({country}). Tier {tier}, {status}."
    attributes:
      supplier_code:
        id: att_01KEZF7C00HDZZHMNS4181SKMX
        description: Supplier code as issued by the ERP, for example S-1001.
        type: string
        required: true
        constraints:
          pattern: '^S-[0-9]{4,}$'
      legal_name:
        id: att_01KEZF7C00H73NVMMGX4KPCH9W
        description: Registered legal name including the legal form.
        type: string
        required: true
        searchable: true
        search_weight: A
        authority: approved.suppliers
      country:
        id: att_01KEZF7C00Z60FEN5RNWEENNX2
        description: ISO 3166-1 alpha-2 country code of the registered office.
        type: string
        required: true
        indexed: true
        constraints:
          pattern: '^[A-Z]{2}$'
        authority: approved.suppliers
      city:
        id: att_01KEZF7C009AT17WTRXEX9MT8Y
        description: City of the registered office.
        type: string
        authority: approved.suppliers
      tier:
        id: att_01KEZF7C008DMTQHN3YMSQJH1N
        description: Sourcing tier, 1 strategic, 2 preferred, 3 transactional.
        type: {enum: ['1', '2', '3']}
        default: '3'
        indexed: true
      risk_score:
        id: att_01KEZF7C00NK9JAYQ84CSTKF4C
        description: Supplier risk score from 0 (safe) to 100 (critical), maintained by risk analysts.
        type: integer
        indexed: true
        constraints:
          min: 0
          max: 100
      status:
        id: att_01KEZF7C002QQWMATS9QHMWRAF
        description: Commercial status of the supplier relationship.
        type: {enum: [active, on_hold, terminated]}
        default: active
        indexed: true
      onboarded_on:
        id: att_01KEZF7C00N37SV7HXQT83TCAG
        description: Date the supplier was approved for purchasing.
        type: date
      vat_number:
        id: att_01KEZF7C00NAFHVPJ4YPMXSH3H
        description: VAT registration number.
        type: string
        unique: true
        sensitivity: [confidential]
    traits:
      - trait: Located
        attribute_map: {country: country, city: city}

  Part:
    id: knd_01KEZF7C00WBDCAD84MRED7WQV
    description: A component bought from suppliers and held in stock.
    primary_key: [part_number]
    title_attribute: name
    icon: cog
    color: "#6a994e"
    search:
      embedding_template: "{name}: {summary} Category {category}."
    attributes:
      part_number:
        id: att_01KEZF7C00V0MZ56VTARJ76YAC
        description: Part number, for example P-10001.
        type: string
        required: true
        constraints:
          pattern: '^P-[0-9]{5,}$'
      name:
        id: att_01KEZF7C00J7TH66AHX4NEB2AP
        description: Short catalogue name including the main size or rating.
        type: string
        required: true
        searchable: true
        search_weight: A
      summary:
        id: att_01KEZF7C00E3M1JDMAG6KQJH02
        description: One sentence on what the part is used for.
        type: text
        searchable: true
        search_weight: B
      category:
        id: att_01KEZF7C00DFFAK6XAMCQEDBDJ
        description: Commodity group of the part.
        type: {enum: [bearing, fastener, seal, gasket, valve, filter, sensor, motor, hose]}
        required: true
        indexed: true
      unit_cost:
        id: att_01KEZF7C00JHNXEZYX47QP6TY8
        description: Standard unit cost in euro.
        type: decimal(10,2)
        constraints:
          min: 0
      weight_kg:
        id: att_01KEZF7C00ZEX82XM0N3DGHD4Q
        description: Unit weight in kilograms.
        type: decimal(8,3)
        constraints:
          min: 0
      lifecycle:
        id: att_01KEZF7C00JFDYDNGH9ZXPWFB6
        description: Lifecycle stage of the part.
        type: {enum: [active, phase_out, obsolete]}
        default: active
        indexed: true
      hazardous:
        id: att_01KEZF7C006G1G3TGKRKJW1ZB6
        description: True when shipping the part needs dangerous goods handling.
        type: boolean
        default: false
      supplier_count:
        id: att_01KEZF7C008N7SZ6W62PVEXNPQ
        description: Number of suppliers that can supply the part. Derived.
        type: integer
        derivation: supplier_count
      single_sourced:
        id: att_01KEZF7C00ADBHATJJKN9YZG49
        description: True when exactly one supplier can supply the part. Derived.
        type: boolean
        derivation: single_sourced

  Plant:
    id: knd_01KEZF7C00PHQ0PFYPZECGNE96
    description: A Corvane production or distribution site that stocks and consumes parts.
    primary_key: [plant_code]
    title_attribute: name
    icon: warehouse
    color: "#bc4749"
    attributes:
      plant_code:
        id: att_01KEZF7C009JW6DCQJZM00STP8
        description: Plant code, for example PL-01.
        type: string
        required: true
        constraints:
          pattern: '^PL-[0-9]{2,}$'
      name:
        id: att_01KEZF7C00F94YAC49PH6QGNMH
        description: Site name.
        type: string
        required: true
        searchable: true
        search_weight: A
      plant_type:
        id: att_01KEZF7C00YDQ4EA8M0WV3KJ8T
        description: Main activity of the site.
        type: {enum: [assembly, machining, distribution_hub, warehouse]}
        required: true
        indexed: true
      country:
        id: att_01KEZF7C00EPAKJ5RH34T1XBB0
        description: ISO 3166-1 alpha-2 country code of the site.
        type: string
        required: true
        constraints:
          pattern: '^[A-Z]{2}$'
      city:
        id: att_01KEZF7C00H48J07NBG96J0Q2S
        description: City of the site.
        type: string
      capacity_per_month:
        id: att_01KEZF7C00ZF1HB73ZWGJ6CRPF
        description: Handling capacity in units per month.
        type: integer
        constraints:
          min: 0
    traits:
      - trait: Located
        attribute_map: {country: country, city: city}

  PurchaseOrder:
    id: knd_01KEZF7C00M11T0RH8CAVBW897
    description: An order placed with a supplier for one part, delivered to one plant.
    primary_key: [po_number]
    title_attribute: po_number
    icon: file-text
    color: "#f2a541"
    attributes:
      po_number:
        id: att_01KEZF7C00A7ZA9X9YZ121SJ3M
        description: Purchase order number, for example PO-200001.
        type: string
        required: true
        constraints:
          pattern: '^PO-[0-9]{6,}$'
      supplier:
        id: att_01KEZF7C007AC0DF84HCQRX9ZT
        description: Key of the supplier the order is issued to. Backs the Relation issued_to.
        type: ref(Supplier)
        required: true
        indexed: true
        authority: erp.purchase_orders
      status:
        id: att_01KEZF7C00FJSCTF8SM9V93CCN
        description: Order lifecycle stage.
        type: {enum: [draft, issued, shipped, received, cancelled]}
        required: true
        default: draft
        indexed: true
        authority: erp.purchase_orders
      ordered_on:
        id: att_01KEZF7C00G50HMR04NHDPXS30
        description: Date the order was placed.
        type: date
        required: true
        authority: erp.purchase_orders
      due_on:
        id: att_01KEZF7C00537ZFFD1EAF7VVNY
        description: Date the goods are due at the plant.
        type: date
        indexed: true
        authority: erp.purchase_orders
      quantity:
        id: att_01KEZF7C002MCFVSZ1DAVJF0GX
        description: Ordered quantity in units.
        type: integer
        required: true
        constraints:
          min: 1
        authority: erp.purchase_orders
      unit_price:
        id: att_01KEZF7C000WEBH0WCJQB4RVDY
        description: Agreed unit price in the order currency.
        type: decimal(10,2)
        constraints:
          min: 0
        authority: erp.purchase_orders
      currency:
        id: att_01KEZF7C00J5R88XKX6ADBZZNB
        description: ISO 4217 currency code of the order.
        type: {enum: [EUR, USD, GBP, PLN, CZK, SEK]}
        default: EUR
        authority: erp.purchase_orders

  Contract:
    id: knd_01KEZF7C009ABD2QEAXC8GGK0S
    description: A framework supply agreement with a supplier.
    primary_key: [contract_number]
    title_attribute: title
    icon: file-signature
    color: "#7b2cbf"
    attributes:
      contract_number:
        id: att_01KEZF7C003FE2Q3EQFW24DZEH
        description: Contract number, for example C-3001.
        type: string
        required: true
        constraints:
          pattern: '^C-[0-9]{4,}$'
      title:
        id: att_01KEZF7C00CFZFWA9G1XT79MPS
        description: Contract title.
        type: string
        required: true
        searchable: true
        search_weight: A
      status:
        id: att_01KEZF7C00YD0EG06JDWR08E41
        description: Contract lifecycle stage.
        type: {enum: [draft, active, expired, terminated]}
        default: draft
        indexed: true
      start_date:
        id: att_01KEZF7C007VD02SKT2KXJ9PCG
        description: First day of validity.
        type: date
        required: true
      end_date:
        id: att_01KEZF7C00CR3SH2H824DWQR0F
        description: Last day of validity.
        type: date
        indexed: true
      annual_value:
        id: att_01KEZF7C00NTAVMNCH8895162V
        description: Expected yearly spend in the contract currency.
        type: decimal(12,2)
        constraints:
          min: 0
      currency:
        id: att_01KEZF7C00CS1T7RWHANT46NE1
        description: ISO 4217 currency code of the contract.
        type: {enum: [EUR, USD, GBP, PLN, CZK, SEK]}
        default: EUR
      incoterm:
        id: att_01KEZF7C00ZFG9PEEA1M6HFMBJ
        description: Delivery terms (Incoterms 2020).
        type: {enum: [EXW, FCA, DAP, DDP]}
      payment_terms_days:
        id: att_01KEZF7C003X199DJHX5644F1Z
        description: Days from invoice to payment.
        type: integer
        constraints:
          min: 0
          max: 180
      auto_renew:
        id: att_01KEZF7C005PHCTDV9BNJ7WX24
        description: True when the contract renews unless a party gives notice.
        type: boolean
        default: false
      approved_by:
        id: att_01KEZF7C00WNHWFARKGZ8W29BW
        description: Principal that approved the contract.
        type: string
      approved_at:
        id: att_01KEZF7C00WYPD04ZX3X2PZ1DG
        description: When the contract was approved.
        type: timestamp

  RiskFlag:
    id: knd_01KEZF7C0063DPT7NYQNXBHB1M
    description: A risk raised on a supplier. Keys are minted when the flag is created.
    title_attribute: reason
    icon: flag
    color: "#d00000"
    attributes:
      severity:
        id: att_01KEZF7C00E1JP033T92691HJE
        description: How serious the risk is.
        type: {enum: [low, medium, high, critical]}
        required: true
        indexed: true
      reason:
        id: att_01KEZF7C0034YSH4VMTCR4FJ7H
        description: Evidence-based reason for the flag.
        type: text
        required: true
        searchable: true
        search_weight: B
      raised_at:
        id: att_01KEZF7C00YF1GG38RVRAS4KAG
        description: When the flag was raised.
        type: timestamp
        required: true
      raised_by:
        id: att_01KEZF7C00B79MRF0NBF18SAA0
        description: Principal that raised the flag.
        type: string
        required: true

relations:
  supplied_by:
    id: rel_01KEZF7C00F4CJ0YEKSMQT6PC0
    inverse_api_name: supplies
    description: A supplier can supply the part.
    from_kind: Part
    to_kind: Supplier
    cardinality: many_to_many
    attributes:
      is_primary:
        id: att_01KEZF7C006T6ZF8E6CK1PE4XY
        description: True for the preferred supplier of the part.
        type: boolean
        default: false
      lead_time_days:
        id: att_01KEZF7C00A7JKVNZEGB5RZ5R1
        description: Typical days from order to delivery.
        type: integer
        constraints:
          min: 0

  stocked_at:
    id: rel_01KEZF7C00Q2XMMMZWZ79AQCME
    inverse_api_name: stocks
    description: A plant keeps the part in stock.
    from_kind: Part
    to_kind: Plant
    cardinality: many_to_many
    attributes:
      quantity:
        id: att_01KEZF7C00H9KNFH2WET35SM5Q
        description: Units on hand.
        type: integer
        required: true
        constraints:
          min: 0

  issued_to:
    id: rel_01KEZF7C0046ZA6Z11PH3MARM5
    inverse_api_name: purchase_orders
    description: The supplier an order is issued to; derived from PurchaseOrder.supplier.
    from_kind: PurchaseOrder
    to_kind: Supplier
    cardinality: many_to_one
    required_from: true
    on_delete: restrict
    backing: foreign_key
    foreign_key_attribute: supplier

  for_part:
    id: rel_01KEZF7C00C8CSM7KQZ0J1EY0T
    inverse_api_name: ordered_in
    description: The part an order buys.
    from_kind: PurchaseOrder
    to_kind: Part
    cardinality: many_to_one
    required_from: true
    on_delete: restrict

  delivered_to:
    id: rel_01KEZF7C007EYQRE3Q2ADNS3FF
    inverse_api_name: receives
    description: The plant an order is delivered to.
    from_kind: PurchaseOrder
    to_kind: Plant
    cardinality: many_to_one

  with_supplier:
    id: rel_01KEZF7C00BJEFSY9EWW9CM2SA
    inverse_api_name: contracts
    description: The supplier party to a contract.
    from_kind: Contract
    to_kind: Supplier
    cardinality: many_to_one
    required_from: true
    on_delete: restrict

  flags:
    id: rel_01KEZF7C00QJBDQPR4Z2R5BEJP
    inverse_api_name: risk_flags
    description: The supplier a risk flag is raised on.
    from_kind: RiskFlag
    to_kind: Supplier
    cardinality: many_to_one
    required_from: true

traits:
  Located:
    id: trt_01KEZF7C00E1SNG0SW6QRM5904
    description: Something with a physical location.
    attributes:
      country:
        id: att_01KEZF7C001DBRJSZYG5XGV125
        description: ISO 3166-1 alpha-2 country code.
        type: string
        required: true
      city:
        id: att_01KEZF7C00ZT5A7MS0JQBKHA0Y
        description: City.
        type: string

operations:
  flag_supplier_risk:
    id: opr_01KEZF7C0038VRE1JRZAKM367W
    description: Flag a supplier as a risk with a reason and a severity.
    parameters:
      - name: supplier
        type: ref(Supplier)
        required: true
        description: The supplier to flag.
      - name: severity
        type: {enum: [low, medium, high, critical]}
        required: true
        description: How serious the risk is.
      - name: reason
        type: text
        required: true
        description: Evidence-based reason for the flag.
    preconditions:
      - expression: record(supplier).status != "terminated"
        message: Terminated suppliers cannot be flagged.
    steps:
      - step: create_record
        kind: RiskFlag
        values:
          severity: params.severity
          reason: params.reason
          raised_at: now()
          raised_by: principal.id
      - step: create_link
        relation: flags
        from: $step[0]
        to: params.supplier
    review_policy:
      mode: expression
      expression: params.severity == "critical"
    permissions: [risk-analyst, agent-risk]
    side_effects: [risk_flag_raised]
    rate_limit:
      max_calls: 60
      per_seconds: 60

  approve_contract:
    id: opr_01KEZF7C00M9EPS9XT2A9YGAK7
    description: Approve a draft contract so that it becomes active.
    parameters:
      - name: contract
        type: ref(Contract)
        required: true
        description: The draft contract to approve.
    preconditions:
      - expression: record(contract).status == "draft"
        message: Only draft contracts can be approved.
    steps:
      - step: update_record
        kind: Contract
        target: params.contract
        values:
          status: '"active"'
          approved_by: principal.id
          approved_at: now()
    review_policy:
      mode: expression
      expression: record(contract).annual_value > 500000
    permissions: [contract-manager]
    side_effects: [contract_approved]

derivations:
  supplier_count:
    id: drv_01KEZF7C00MMX6MTB4YG6XW54X
    description: Count of suppliers linked to a part through supplied_by.
    definition:
      variant: aggregate
      kind: Part
      attribute: supplier_count
      relation: supplied_by
      function: count

  single_sourced:
    id: drv_01KEZF7C00DFJP2E5C2F29QVHQ
    description: True when a part has exactly one supplier.
    definition:
      variant: expression
      kind: Part
      attribute: single_sourced
      expression: supplier_count == 1

sources:
  approved.suppliers:
    id: src_01KEZF7C00EDDEFRGSAXSHCWJ2
    description: CSV list of approved suppliers maintained by procurement.
    type: csv
    connection: secret://env/SUPPLY_APPROVED_SUPPLIERS_CSV
    target_kind: Supplier
    key_mapping: [supplier_code]
    attribute_mapping:
      legal_name:
        column: legal_name
        transforms:
          - {name: trim}
      country:
        column: country
        transforms:
          - {name: trim}
          - {name: upper}
      city:
        column: city
        transforms:
          - {name: trim}
      tier:
        column: tier
      risk_score:
        column: risk_score
        transforms:
          - {name: cast, args: {to: integer}}
      onboarded_on:
        column: onboarded_on
        transforms:
          - {name: parse_date, args: {format: '%Y-%m-%d'}}
    sync_mode: snapshot
    target_branch_policy:
      branch_template: 'source/{source}'
      merge_policy: auto_when_clean

  erp.purchase_orders:
    id: src_01KEZF7C00PMKRJJ98PAYYB4SX
    description: Purchase orders in the ERP table purchase_orders.
    type: postgres_table
    connection: secret://env/ERP_DSN
    target_kind: PurchaseOrder
    key_mapping: [po_no]
    attribute_mapping:
      supplier:
        column: vendor_id
      status:
        column: state
        transforms:
          - {name: lower}
      ordered_on:
        column: ordered
        transforms:
          - {name: parse_date, args: {format: '%Y-%m-%d'}}
      due_on:
        column: due
        transforms:
          - {name: parse_date, args: {format: '%Y-%m-%d'}}
      quantity:
        column: qty
        transforms:
          - {name: cast, args: {to: integer}}
      unit_price:
        column: price
        transforms:
          - {name: cast, args: {to: decimal}}
      currency:
        column: currency
        transforms:
          - {name: upper}
    relation_mapping:
      - relation: for_part
        columns: [part_no]
      - relation: delivered_to
        columns: [plant_code]
    scope_filter: "state <> 'archived'"
    sync_mode: incremental
    watermark_column: updated_at
    tombstone_column: deleted_at
    schedule: '0 2 * * *'
    target_branch_policy:
      branch_template: 'source/{source}'
      merge_policy: auto_with_authority
